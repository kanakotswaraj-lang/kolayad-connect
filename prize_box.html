<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ - കോളയാട് കണക്ട്</title>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --border-color: rgba(59, 130, 246, 0.3);
      --accent-gold: #facc15;
    }
    body {
      background-color: var(--bg-body);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .header {
      background: var(--bg-app);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 10;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      margin-right: 12px;
    }
    .game-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 12px 20px;
      box-sizing: border-box;
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-gold);
      z-index: 5;
    }
    /* കളി നടക്കുന്ന ബോർഡ് */
    #playArea {
      position: relative;
      width: 100%;
      max-width: 420px;
      flex: 1;
      overflow: hidden;
      touch-action: manipulation;
    }
    /* താഴെ നിന്ന് വെടിവെക്കുന്ന തോക്ക് / പ്ലെയർ */
    .shooter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 38px;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 0 10px #38bdf8);
    }
    /* മുകളിൽ നിന്ന് താഴേക്ക് വരുന്ന ബോക്സുകൾ */
    .target-box {
      position: absolute;
      width: 55px;
      height: 55px;
      background: linear-gradient(145deg, #f59e0b, #d97706);
      border: 2.5px solid #facc15;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .target-box:active {
      transform: scale(0.85);
    }
    /* തൊടുകുമ്പോൾ പോകുന്ന ബുള്ളറ്റ് */
    .bullet {
      position: absolute;
      width: 8px;
      height: 18px;
      background: #38bdf8;
      border-radius: 4px;
      box-shadow: 0 0 8px #38bdf8;
      z-index: 8;
    }
    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 25, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .action-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="games.html" class="back-btn">← തിരികെ</a>
    <h2 style="margin: 0; font-size: 17px; color: #facc15;">🎯 ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ</h2>
  </div>

  <div class="game-container">
    <div class="hud">
      <div>സ്കോർ: <span id="scoreVal">0</span></div>
      <div>ലൈഫ്: <span id="lifeVal">❤️❤️❤️</span></div>
    </div>

    <div id="playArea" onclick="shootBullet(event)">
      <!-- താഴെയുള്ള തോക്ക് -->
      <div class="shooter" id="shooterObj">🚀</div>

      <!-- തുടക്കത്തിലെ സ്ക്രീൻ -->
      <div id="startScreen" class="start-screen">
        <h2 style="color: #facc15; font-size: 22px; margin-bottom: 10px;">ബോക്സുകൾ വെടിവെച്ച് വീഴ്ത്തൂ!</h2>
        <p style="color: #94a3b8; font-size: 13.5px; margin-bottom: 20px;">സ്ക്രീനിൽ തൊട്ടാൽ റോക്കറ്റ് വെടിയുതിർക്കും. താഴെ എത്തും മുൻപ് ബോക്സുകൾ തകർക്കൂ!</p>
        <button class="action-btn" onclick="startGame()">കളി തുടങ്ങാം 🎮</button>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let lives = 3;
    let gameInterval = null;
    let boxTimer = null;
    let isPlaying = false;

    const playArea = document.getElementById('playArea');
    const shooter = document.getElementById('shooterObj');

    function startGame() {
      score = 0;
      lives = 3;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('lifeVal').innerText = '❤️❤️❤️';
      document.getElementById('startScreen').style.display = 'none';
      
      // പഴയ ബോക്സുകൾ നീക്കം ചെയ്യുക
      document.querySelectorAll('.target-box').forEach(b => b.remove());
      
      isPlaying = true;
      
      // പുതിയ ബോക്സുകൾ മുകളിൽ നിന്ന് താഴേക്ക് വരുത്തുക
      boxTimer = setInterval(createBox, 1500);
      gameInterval = setInterval(updateGame, 30);
    }

    function createBox() {
      if (!isPlaying) return;
      const box = document.createElement('div');
      box.classList.add('target-box');
      box.innerHTML = ['🎁', '💰', '⭐', '📦'][Math.floor(Math.random() * 4)];
      
      const maxX = playArea.clientWidth - 60;
      const randomX = Math.floor(Math.random() * maxX);
      box.style.left = randomX + 'px';
      box.style.top = '-60px';
      
      // ബോക്സിൽ തൊട്ടാൽ തകരുന്ന രീതി (Tap to Shoot)
      box.onclick = (e) => {
        e.stopPropagation();
        if (!isPlaying) return;
        score += 10;
        document.getElementById('scoreVal').innerText = score;
        
        // ചെറിയൊരു പൊട്ടൽ എഫക്റ്റ്
        box.innerHTML = '💥';
        box.style.transform = 'scale(1.3)';
        setTimeout(() => box.remove(), 120);
      };

      playArea.appendChild(box);
    }

    function updateGame() {
      if (!isPlaying) return;
      
      const boxes = document.querySelectorAll('.target-box');
      boxes.forEach(box => {
        let currentTop = parseFloat(box.style.top || -60);
        currentTop += 2.2; // താഴേക്ക് വരുന്ന വേഗത
        
        // താഴെ എത്തിയാൽ ലൈഫ് കുറയുക
        if (currentTop > playArea.clientHeight - 70) {
          box.remove();
          lives--;
          updateLivesDisplay();
          if (lives <= 0) {
            endGame();
          }
        } else {
          box.style.top = currentTop + 'px';
        }
      });
    }

    function shootBullet(e) {
      if (!isPlaying) return;
      
      // സ്ക്രീനിൽ തൊട്ട ഭാഗത്തേക്ക് റോക്കറ്റ് നീങ്ങുക
      const rect = playArea.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      shooter.style.left = (clickX - 20) + 'px';

      // ബുള്ളറ്റ് മുകളിലേക്ക് പായുക
      const bullet = document.createElement('div');
      bullet.classList.add('bullet');
      bullet.style.left = clickX + 'px';
      bullet.style.bottom = '70px';
      playArea.appendChild(bullet);

      let bulletTimer = setInterval(() => {
        let currentBottom = parseFloat(bullet.style.bottom);
        currentBottom += 15;
        bullet.style.bottom = currentBottom + 'px';

        // ബോക്സുകളിൽ കൊള്ളുന്നുണ്ടോ എന്ന് പരിശോധിക്കുക
        const boxes = document.querySelectorAll('.target-box');
        boxes.forEach(box => {
          const boxRect = box.getBoundingClientRect();
          const bulletRect = bullet.getBoundingClientRect();

          if (bulletRect.left < boxRect.right && bulletRect.right > boxRect.left &&
              bulletRect.top < boxRect.bottom && bulletRect.bottom > boxRect.top) {
            // ബോക്സ് തകർന്നു!
            box.innerHTML = '💥';
            setTimeout(() => box.remove(), 100);
            bullet.remove();
            clearInterval(bulletTimer);
            score += 15;
            document.getElementById('scoreVal').innerText = score;
          }
        });

        // സ്ക്രീനിന് പുറത്തുപോയാൽ ബുള്ളറ്റ് ഒഴിവാക്കുക
        if (currentBottom > playArea.clientHeight) {
          bullet.remove();
          clearInterval(bulletTimer);
        }
      }, 20);
    }

    function updateLivesDisplay() {
      let hearts = '';
      for(let i=0; i<lives; i++) hearts += '❤️';
      document.getElementById('lifeVal').innerText = hearts || '💔';
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(boxTimer);
      
      const startScreen = document.getElementById('startScreen');
      startScreen.style.display = 'flex';
      startScreen.innerHTML = `
        <h2 style="color: #ef4444; font-size: 22px; margin-bottom: 5px;">കളി കഴിഞ്ഞു! (Game Over)</h2>
        <p style="color: #facc15; font-size: 16px; font-weight: 900; margin-bottom: 15px;">ലഭിച്ച ആകെ സ്കോർ: ${score}</p>
        <button class="action-btn" onclick="startGame()">വീണ്ടും കളിക്കുക 🔄</button>
      `;
    }
  </script>
</body>
</html>
