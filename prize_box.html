<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ - കോളയാട് കണക്ട്</title>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --border-color: rgba(59, 130, 246, 0.3);
      --accent-gold: #facc15;
    }
    body {
      background-color: var(--bg-body);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .header {
      background: var(--bg-app);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 10;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      margin-right: 12px;
    }
    .game-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 10px 15px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 900;
      color: var(--accent-gold);
      z-index: 5;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #playArea {
      position: relative;
      width: 100%;
      max-width: 420px;
      flex: 1;
      overflow: hidden;
      touch-action: none;
    }
    .shooter {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 44px;
      z-index: 10;
      user-select: none;
      filter: drop-shadow(0 0 12px #38bdf8);
      cursor: pointer;
    }
    .target-box {
      position: absolute;
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #f59e0b, #d97706);
      border: 2.5px solid #facc15;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
    }
    .target-bomb {
      background: linear-gradient(145deg, #ef4444, #991b1b);
      border-color: #f87171;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
    }
    .bullet {
      position: absolute;
      width: 8px;
      height: 18px;
      background: #38bdf8;
      border-radius: 4px;
      box-shadow: 0 0 8px #38bdf8;
      z-index: 8;
    }
    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 25, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .action-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="games.html" class="back-btn">← തിരികെ</a>
    <h2 style="margin: 0; font-size: 17px; color: #facc15;">🎯 ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ</h2>
  </div>

  <div class="game-container">
    <div class="hud">
      <div>സ്കോർ: <span id="scoreVal">0</span>/1000</div>
      <div>സ്റ്റേജ്: <span id="stageVal">1</span>/5</div>
      <div>ലൈഫ്: <span id="lifeVal">❤️❤️❤️</span></div>
    </div>

    <div id="playArea">
      <div class="shooter" id="shooterObj" onpointerdown="shootDirectly(event)">🚀</div>

      <div id="startScreen" class="start-screen">
        <h2 style="color: #facc15; font-size: 22px; margin-bottom: 10px;">ചലഞ്ച് കളി തുടങ്ങാം! 🚀</h2>
        <p style="color: #94a3b8; font-size: 13.5px; margin-bottom: 15px;">
          • വിരൽ വെച്ച് റോക്കറ്റ് എവിടേക്കും നീക്കാം.<br>
          • റോക്കറ്റിൽ അമർത്തുമ്പോൾ വെടിവയ്ക്കാം.<br>
          • <b>5 സ്റ്റേജുകൾ</b> താണ്ടി <b>1000 പോയിന്റ്</b> നേടി ജാക്ക്പോട്ട് നേടൂ!<br>
          • ബോംബുകളിൽ (💣) വെടിവെച്ചാൽ ലൈഫ് പോകും!
        </p>
        <button class="action-btn" onclick="startGame()">കളി തുടങ്ങാം 🎮</button>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let lives = 3;
    let stage = 1;
    let gameInterval = null;
    let boxTimer = null;
    let isPlaying = false;
    let fallSpeed = 1.1;

    const playArea = document.getElementById('playArea');
    const shooter = document.getElementById('shooterObj');
    let shooterX = window.innerWidth / 2;
    let shooterY = window.innerHeight - 180;

    function startGame() {
      score = 0;
      lives = 3;
      stage = 1;
      fallSpeed = 1.1;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('stageVal').innerText = stage + '/5';
      document.getElementById('lifeVal').innerText = '❤️❤️❤️';
      document.getElementById('startScreen').style.display = 'none';
      
      document.querySelectorAll('.target-box, .target-bomb').forEach(b => b.remove());
      isPlaying = true;
      
      boxTimer = setInterval(createTarget, 1400);
      gameInterval = setInterval(updateGame, 30);
    }

    playArea.addEventListener('pointermove', (e) => {
      if (!isPlaying) return;
      const rect = playArea.getBoundingClientRect();
      shooterX = e.clientX - rect.left;
      shooterY = e.clientY - rect.top;

      if (shooterX < 25) shooterX = 25;
      if (shooterX > playArea.clientWidth - 25) shooterX = playArea.clientWidth - 25;
      if (shooterY < 80) shooterY = 80;
      if (shooterY > playArea.clientHeight - 40) shooterY = playArea.clientHeight - 40;

      shooter.style.left = shooterX + 'px';
      shooter.style.top = shooterY + 'px';
      shooter.style.transform = 'translate(-50%, -50%)';
    });

    function shootDirectly(e) {
      e.stopPropagation();
      if (!isPlaying) return;
      shootBullet(shooterX, shooterY);
    }

    function createTarget() {
      if (!isPlaying) return;
      const el = document.createElement('div');
      
      // ബോംബുകളുടെ എണ്ണം കൂട്ടിയിരിക്കുന്നു (32% സാധ്യത)
      let isBomb = Math.random() < 0.32;
      
      if (isBomb) {
        el.classList.add('target-box', 'target-bomb');
        el.innerHTML = '💣';
      } else {
        el.classList.add('target-box');
        el.innerHTML = ['🎁', '💰', '⭐', '📦'][Math.floor(Math.random() * 4)];
      }
      
      const maxX = playArea.clientWidth - 60;
      const randomX = Math.floor(Math.random() * maxX);
      el.style.left = randomX + 'px';
      el.style.top = '-60px';
      
      playArea.appendChild(el);
    }

    function updateGame() {
      if (!isPlaying) return;
      
      const targets = document.querySelectorAll('.target-box');
      targets.forEach(el => {
        let currentTop = parseFloat(el.style.top || -60);
        currentTop += fallSpeed; 
        
        if (currentTop > playArea.clientHeight) {
          el.remove();
        } else {
          el.style.top = currentTop + 'px';
        }
      });
    }

    function shootBullet(xPos, yPos) {
      const bullet = document.createElement('div');
      bullet.classList.add('bullet');
      bullet.style.left = (xPos - 4) + 'px';
      bullet.style.top = (yPos - 25) + 'px';
      playArea.appendChild(bullet);

      let bulletTimer = setInterval(() => {
        let currentTop = parseFloat(bullet.style.top);
        currentTop -= 16; 
        bullet.style.top = currentTop + 'px';

        const targets = document.querySelectorAll('.target-box');
        targets.forEach(el => {
          const boxRect = el.getBoundingClientRect();
          const bulletRect = bullet.getBoundingClientRect();

          if (bulletRect.left < boxRect.right && bulletRect.right > boxRect.left &&
              bulletRect.top < boxRect.bottom && bulletRect.bottom > boxRect.top) {
            
            if (el.classList.contains('target-bomb')) {
              lives--;
              updateLivesDisplay();
              el.innerHTML = '💥';
              if (lives <= 0) endGame(false);
            } else {
              score += 10;
              checkScoreAndStage();
              el.innerHTML = '💥';
            }

            setTimeout(() => el.remove(), 100);
            bullet.remove();
            clearInterval(bulletTimer);
          }
        });

        if (currentTop < 0) {
          bullet.remove();
          clearInterval(bulletTimer);
        }
      }, 20);
    }

    function checkScoreAndStage() {
      document.getElementById('scoreVal').innerText = score;
      
      // 5 സ്റ്റേജുകളായി ക്രമീകരിച്ചിരിക്കുന്നു
      if (score >= 800 && stage < 5) {
        stage = 5;
        fallSpeed = 2.3;
      } else if (score >= 600 && stage < 4) {
        stage = 4;
        fallSpeed = 2.0;
      } else if (score >= 400 && stage < 3) {
        stage = 3;
        fallSpeed = 1.7;
      } else if (score >= 200 && stage < 2) {
        stage = 2;
        fallSpeed = 1.4;
      }
      document.getElementById('stageVal').innerText = stage + '/5';

      if (score >= 1000) {
        endGame(true);
      }
    }

    function updateLivesDisplay() {
      let hearts = '';
      for(let i=0; i<lives; i++) hearts += '❤️';
      document.getElementById('lifeVal').innerText = hearts || '💔';
    }

    function endGame(isWon) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(boxTimer);
      
      const startScreen = document.getElementById('startScreen');
      startScreen.style.display = 'flex';
      
      if (isWon) {
        startScreen.innerHTML = `
          <h2 style="color: #facc15; font-size: 22px; margin-bottom: 5px;">🎉 അതിഗംഭീരം! താങ്കൾ ജാക്ക്പോട്ട് വിജയിച്ചു! 🏆</h2>
          <p style="color: #4ade80; font-size: 15px; font-weight: 900; margin-bottom: 15px;">ആകെ സ്കോർ: ${score}/1000</p>
          <button class="action-btn" onclick="startGame()">വീണ്ടും കളിക്കുക 🔄</button>
        `;
      } else {
        startScreen.innerHTML = `
          <h2 style="color: #ef4444; font-size: 22px; margin-bottom: 5px;">കളി കഴിഞ്ഞു! (Game Over)</h2>
          <p style="color: #facc15; font-size: 15px; font-weight: 900; margin-bottom: 15px;">ലഭിച്ച സ്കോർ: ${score}</p>
          <button class="action-btn" onclick="startGame()">വീണ്ടും ശ്രമിക്കൂ 🔄</button>
        `;
      }
    }
  </script>
</body>
</html>
