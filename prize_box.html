<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ - കോളയാട് കണക്ട്</title>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --border-color: rgba(59, 130, 246, 0.3);
      --accent-gold: #facc15;
    }
    body {
      background-color: var(--bg-body);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .header {
      background: var(--bg-app);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 10;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 800;
      text-decoration: none;
      margin-right: 12px;
    }
    .game-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 10px 15px;
      box-sizing: border-box;
      font-size: 14.5px;
      font-weight: 900;
      color: var(--accent-gold);
      z-index: 5;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #playArea {
      position: relative;
      width: 100%;
      max-width: 420px;
      flex: 1;
      overflow: hidden;
      touch-action: none;
    }
    .shooter {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 42px;
      z-index: 10;
      user-select: none;
      filter: drop-shadow(0 0 12px #38bdf8);
      pointer-events: none;
    }
    .target-box {
      position: absolute;
      width: 55px;
      height: 55px;
      background: linear-gradient(145deg, #f59e0b, #d97706);
      border: 2.5px solid #facc15;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
      cursor: pointer;
    }
    /* ബോംബിന്റെ സ്റ്റൈൽ */
    .target-bomb {
      background: linear-gradient(145deg, #ef4444, #991b1b);
      border-color: #f87171;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
    }
    .bullet {
      position: absolute;
      width: 8px;
      height: 18px;
      background: #38bdf8;
      border-radius: 4px;
      box-shadow: 0 0 8px #38bdf8;
      z-index: 8;
    }
    .start-screen {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 25, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .action-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="games.html" class="back-btn">← തിരികെ</a>
    <h2 style="margin: 0; font-size: 17px; color: #facc15;">🎯 ബോക്സ് ബ്ലാസ്റ്റർ ഷൂട്ടർ</h2>
  </div>

  <div class="game-container">
    <div class="hud">
      <div>സ്കോർ: <span id="scoreVal">0</span>/500</div>
      <div>സ്റ്റേജ്: <span id="stageVal">1</span></div>
      <div>ലൈഫ്: <span id="lifeVal">❤️❤️❤️</span></div>
    </div>

    <div id="playArea">
      <div class="shooter" id="shooterObj">🚀</div>

      <div id="startScreen" class="start-screen">
        <h2 style="color: #facc15; font-size: 22px; margin-bottom: 10px;">ചലഞ്ച് ഗെയിം തുടങ്ങാം! 🚀</h2>
        <p style="color: #94a3b8; font-size: 13.5px; margin-bottom: 15px;">
          • ലക്ഷ്യം: <b>500 പോയിന്റ്</b> നേടി വിജയിക്കുക!<br>
          • ബോംബുകളിൽ (💣) വെടിവെച്ചാൽ ലൈഫ് പോകും!<br>
          • സ്റ്റേജുകൾ കയറുമ്പോൾ വേഗത കൂടും!
        </p>
        <button class="action-btn" onclick="startGame()">കളി തുടങ്ങാം 🎮</button>
      </div>
    </div>
  </div>

  <script>
    let score = 0;
    let lives = 3;
    let stage = 1;
    let gameInterval = null;
    let boxTimer = null;
    let isPlaying = false;
    let fallSpeed = 1.8;

    const playArea = document.getElementById('playArea');
    const shooter = document.getElementById('shooterObj');
    let shooterX = window.innerWidth / 2;

    function startGame() {
      score = 0;
      lives = 3;
      stage = 1;
      fallSpeed = 1.8;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('stageVal').innerText = stage;
      document.getElementById('lifeVal').innerText = '❤️❤️❤️';
      document.getElementById('startScreen').style.display = 'none';
      
      document.querySelectorAll('.target-box, .target-bomb').forEach(b => b.remove());
      isPlaying = true;
      
      boxTimer = setInterval(createTarget, 1400);
      gameInterval = setInterval(updateGame, 30);
    }

    playArea.addEventListener('pointermove', (e) => {
      if (!isPlaying) return;
      const rect = playArea.getBoundingClientRect();
      shooterX = e.clientX - rect.left;
      if (shooterX < 20) shooterX = 20;
      if (shooterX > playArea.clientWidth - 20) shooterX = playArea.clientWidth - 20;
      shooter.style.left = shooterX + 'px';
      shooter.style.transform = 'translateX(-50%)';
    });

    playArea.addEventListener('pointerdown', (e) => {
      if (!isPlaying) return;
      shootBullet(shooterX);
    });

    function createTarget() {
      if (!isPlaying) return;
      const el = document.createElement('div');
      
      // 25% സാധ്യതയിൽ ബോംബ് വരുത്തുക
      let isBomb = Math.random() < 0.25;
      
      if (isBomb) {
        el.classList.add('target-box', 'target-bomb');
        el.innerHTML = '💣';
      } else {
        el.classList.add('target-box');
        el.innerHTML = ['🎁', '💰', '⭐', '📦'][Math.floor(Math.random() * 4)];
      }
      
      const maxX = playArea.clientWidth - 60;
      const randomX = Math.floor(Math.random() * maxX);
      el.style.left = randomX + 'px';
      el.style.top = '-60px';
      
      el.onclick = (e) => {
        e.stopPropagation();
        if (!isPlaying) return;
        if (isBomb) {
          lives--;
          updateLivesDisplay();
          el.innerHTML = '💥';
          if (lives <= 0) endGame(false);
        } else {
          score += 10;
          checkScoreAndStage();
          el.innerHTML = '💥';
        }
        setTimeout(() => el.remove(), 100);
      };

      playArea.appendChild(el);
    }

    function updateGame() {
      if (!isPlaying) return;
      
      const targets = document.querySelectorAll('.target-box');
      targets.forEach(el => {
        let currentTop = parseFloat(el.style.top || -60);
        currentTop += fallSpeed; 
        
        if (currentTop > playArea.clientHeight - 90) {
          el.remove();
          // ബോക്സ് താഴെ വീണാൽ മാത്രം ലൈഫ് കുറയും (ബോംബ് താഴെ വീണാൽ കുറയില്ല)
          if (!el.classList.contains('target-bomb')) {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) endGame(false);
          }
        } else {
          el.style.top = currentTop + 'px';
        }
      });
    }

    function shootBullet(xPos) {
      const bullet = document.createElement('div');
      bullet.classList.add('bullet');
      bullet.style.left = (xPos - 4) + 'px';
      bullet.style.bottom = '120px';
      playArea.appendChild(bullet);

      let bulletTimer = setInterval(() => {
        let currentBottom = parseFloat(bullet.style.bottom);
        currentBottom += 16;
        bullet.style.bottom = currentBottom + 'px';

        const targets = document.querySelectorAll('.target-box');
        targets.forEach(el => {
          const boxRect = el.getBoundingClientRect();
          const bulletRect = bullet.getBoundingClientRect();

          if (bulletRect.left < boxRect.right && bulletRect.right > boxRect.left &&
              bulletRect.top < boxRect.bottom && bulletRect.bottom > boxRect.top) {
            
            if (el.classList.contains('target-bomb')) {
              // ബോംബിൽ വെടിവെച്ചു! ലൈഫ് പോകും
              lives--;
              updateLivesDisplay();
              el.innerHTML = '💥';
              if (lives <= 0) endGame(false);
            } else {
              score += 15;
              checkScoreAndStage();
              el.innerHTML = '💥';
            }

            setTimeout(() => el.remove(), 100);
            bullet.remove();
            clearInterval(bulletTimer);
          }
        });

        if (currentBottom > playArea.clientHeight) {
          bullet.remove();
          clearInterval(bulletTimer);
        }
      }, 20);
    }

    function checkScoreAndStage() {
      document.getElementById('scoreVal').innerText = score;
      
      // സ്റ്റേജ് മാറ്റം (ഓരോ 200 പോയിന്റിലും)
      if (score >= 400 && stage < 3) {
        stage = 3;
        fallSpeed = 3.2;
      } else if (score >= 200 && stage < 2) {
        stage = 2;
        fallSpeed = 2.5;
      }
      document.getElementById('stageVal').innerText = stage;

      // 500 പോയിന്റ് ആയാൽ വിജയം!
      if (score >= 500) {
        endGame(true);
      }
    }

    function updateLivesDisplay() {
      let hearts = '';
      for(let i=0; i<lives; i++) hearts += '❤️';
      document.getElementById('lifeVal').innerText = hearts || '💔';
    }

    function endGame(isWon) {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(boxTimer);
      
      const startScreen = document.getElementById('startScreen');
      startScreen.style.display = 'flex';
      
      if (isWon) {
        startScreen.innerHTML = `
          <h2 style="color: #facc15; font-size: 24px; margin-bottom: 5px;">🎉 അതിഗംഭീരം! മോൾ ജാക്ക്പോട്ട് ജയിച്ചു! 🏆</h2>
          <p style="color: #4ade80; font-size: 16px; font-weight: 900; margin-bottom: 15px;">ആകെ സ്കോർ: ${score}/500</p>
          <button class="action-btn" onclick="startGame()">വീണ്ടും കളിക്കുക 🔄</button>
        `;
      } else {
        startScreen.innerHTML = `
          <h2 style="color: #ef4444; font-size: 22px; margin-bottom: 5px;">കളി കഴിഞ്ഞു! (Game Over)</h2>
          <p style="color: #facc15; font-size: 16px; font-weight: 900; margin-bottom: 15px;">ലഭിച്ച സ്കോർ: ${score}</p>
          <button class="action-btn" onclick="startGame()">വീണ്ടും ശ്രമിക്കൂ 🔄</button>
        `;
      }
    }
  </script>
</body>
</html>
