<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>സ്ഥാപനം ചേർക്കുക - കോളയാട് കണക്ട്</title>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --border-color: rgba(59, 130, 246, 0.4);
      --accent-gold: #facc15;
    }
    body {
      background-color: var(--bg-body);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .header {
      background: var(--bg-app);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 10;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      margin-right: 10px;
    }
    .content-container {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 100%);
    }
    .form-card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .form-title {
      color: var(--accent-gold);
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 15px;
      text-align: center;
    }
    .info-group {
      margin-bottom: 12px;
      text-align: left;
    }
    .info-label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .input-field, .select-field {
      width: 100%;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: 'Noto Sans Malayalam', sans-serif;
      outline: none;
    }
    .loc-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    .action-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    .action-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">← തിരികെ</a>
    <h2 style="margin: 0; font-size: 16px; color: #facc15;">🛒 സ്ഥാപനം ചേർക്കുക</h2>
  </div>

  <div class="content-container">
    <div class="form-card">
      <div class="form-title">കച്ചവട സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ</div>
      
      <div class="info-group">
        <div class="info-label">ഉടമയുടെ പേര്</div>
        <input type="text" class="input-field" id="ownerName" placeholder="പേര് നൽകുക...">
      </div>

      <div class="info-group">
        <div class="info-label">സ്ഥാപനത്തിന്റെ പേര്</div>
        <input type="text" class="input-field" id="shopName" placeholder="കടയുടെ പേര് നൽകുക...">
      </div>

      <div class="info-group">
        <div class="info-label">കാറ്റഗറി</div>
        <select class="select-field" id="shopCategory">
          <option value="സൂപ്പർമാർക്കറ്റ് / പലവ്യഞ്ജനം">സൂപ്പർമാർക്കറ്റ് / പലവ്യഞ്ജനം</option>
          <option value="ഹോട്ടൽ / ബേക്കറി">ഹോട്ടൽ / ബേക്കറി</option>
          <option value="ഹാർഡ്വെയർ / ഇലക്ട്രിക്കൽ">ഹാർഡ്വെയർ / ഇലക്ട്രിക്കൽ</option>
          <option value="വസ്ത്രവ്യാപാരം / സിൽക്സ്">വസ്ത്രവ്യാപാരം / സിൽക്സ്</option>
          <option value="മെഡിക്കൽ ഷോപ്പ് / ഫാർമസി">മെഡിക്കൽ ഷോപ്പ് / ഫാർമസി</option>
          <option value="വർക്ക്ഷോപ്പ് / ഓട്ടോമൊബൈൽ">വർക്ക്ഷോപ്പ് / ഓട്ടോമൊബൈൽ</option>
          <option value="സ്റ്റേഷനറി / ബുക്ക്സ്റ്റാൾ">സ്റ്റേഷനറി / ബുക്ക്സ്റ്റാൾ</option>
          <option value="മറ്റു സേവനങ്ങൾ">മറ്റു സേവനങ്ങൾ</option>
        </select>
      </div>

      <div class="info-group">
        <div class="info-label">ഫോൺ നമ്പർ 1 (കോൾ / WhatsApp)</div>
        <input type="tel" class="input-field" id="phoneCall" placeholder="ആദ്യത്തെ നമ്പർ...">
      </div>

      <div class="info-group">
        <div class="info-label">ഫോൺ നമ്പർ 2 (കോൾ / WhatsApp)</div>
        <input type="tel" class="input-field" id="phoneWhatsapp" placeholder="രണ്ടാമത്തെ നമ്പർ...">
      </div>

      <div class="info-group">
        <div class="info-label">ഗൂഗിൾ മാപ്പ് ലൊക്കേഷൻ</div>
        <input type="url" class="input-field" id="mapLink" placeholder="മാപ്പ് ലിങ്ക് ഇവിടെ വരും അല്ലെങ്കിൽ ഒട്ടിക്കാം...">
        <button type="button" class="loc-btn" onclick="getCurrentLocation()">📍 എന്റെ നിലവിലെ ലൊക്കേഷൻ എടുക്കുക</button>
      </div>

      <div class="info-group">
        <div class="info-label">കടയുടെ ഫോട്ടോ (ചെറിയ സൈസിൽ)</div>
        <input type="file" class="input-field" id="shopImageFile" accept="image/*" style="padding: 7px;">
        <small style="color: #94a3b8; font-size: 11px;">ഫോട്ടോ ഓട്ടോമാറ്റിക്കായി കംപ്രസ് ചെയ്ത് അപ്‌ലോഡ് ചെയ്യപ്പെടും.</small>
      </div>

      <div class="info-group">
        <div class="info-label">സ്ഥലം / വിലാസം</div>
        <input type="text" class="input-field" id="shopAddress" placeholder="സ്ഥലം (ഉദാ: കോളയാട്)...">
      </div>

      <button class="action-btn" id="saveBtn" type="button">വിവരങ്ങൾ സേവ് ചെയ്യുക 💾</button>
    </div>
  </div>

  <!-- Firebase Modular SDK Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.getCurrentLocation = function() {
      if (navigator.geolocation) {
        alert('ലൊക്കേഷൻ എടുക്കുന്നു, ദയവായി അലൗ (Allow) ചെയ്യുക...');
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;
          document.getElementById('mapLink').value = mapUrl;
          alert('ലൊക്കേഷൻ വിജയകരമായി എടുത്തു!');
        }, (error) => {
          alert('ലൊക്കേഷൻ എടുക്കാൻ കഴിഞ്ഞില്ല: ' + error.message);
        }, { enableHighAccuracy: true });
      } else {
        alert('ബ്രൗസർ ലൊക്കേഷൻ സപ്പോർട്ട് ചെയ്യുന്നില്ല.');
      }
    };

    function compressImage(file, maxWidth, maxHeight, quality, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function () {
          let canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
          } else {
            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => { callback(blob); }, 'image/jpeg', quality);
        };
      };
    }

    async function saveprofiledata() {
      const owner = document.getElementById('ownerName').value.trim();
      const shop = document.getElementById('shopName').value.trim();
      const category = document.getElementById('shopCategory').value;
      const phoneCall = document.getElementById('phoneCall').value.trim();
      const phoneWhatsapp = document.getElementById('phoneWhatsapp').value.trim();
      const mapLink = document.getElementById('mapLink').value.trim();
      const address = document.getElementById('shopAddress').value.trim();
      const fileInput = document.getElementById('shopImageFile');

      if (!owner || !shop) {
        alert('ദയവായി ഉടമയുടെ പേരും സ്ഥാപനത്തിന്റെ പേരും നൽകുക!');
        return;
      }

      alert('വിവരങ്ങൾ ഫയർബേസിലേക്ക് സേവ് ചെയ്യുന്നു...');

      try {
        let imageUrl = '';
        if (fileInput.files && fileInput.files[0]) {
          await new Promise((resolve) => {
            compressImage(fileInput.files[0], 600, 600, 0.7, async (compressedBlob) => {
              try {
                const imageName = 'shops/' + Date.now() + '_' + shop + '.jpg';
                const storageRef = ref(storage, imageName);
                const snapshot = await uploadBytes(storageRef, compressedBlob);
                imageUrl = await getDownloadURL(snapshot.ref);
              } catch (err) {
                console.error("Image upload error:", err);
              }
              resolve();
            });
          });
        }

        await addDoc(collection(db, "businesses"), {
          ownerName: owner,
          shopName: shop,
          category: category,
          phoneCall: phoneCall,
          phoneWhatsapp: phoneWhatsapp,
          mapLink: mapLink,
          address: address,
          imageUrl: imageUrl,
          createdAt: serverTimestamp()
        });

        alert('സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തിരിക്കുന്നു!');
        window.location.href = 'index.html';

      } catch (error) {
        alert('ഡാറ്റ സേവ് ചെയ്യുന്നതിൽ പിഴവ്: ' + error.message);
      }
    }

    document.getElementById('saveBtn').addEventListener('click', saveBusinessData);
  </script>
</body>
</html>
