<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>എന്റെ വിവരങ്ങൾ - കോളയാട് കണക്ട്</title>
  
  <!-- Firebase SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0f17; color: #f1f5f9; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

    .app-container {
      width: 100%; max-width: 480px; height: 100vh; background: #0f172a;
      border: 2px solid #eab308; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.25);
    }

    @media (min-width: 481px) { .app-container { border-radius: 28px; height: 95vh; margin-top: 2.5vh; } }

    .sticky-header { flex-shrink: 0; background: #0f172a; border-bottom: 2px solid #1e293b; padding: 16px; text-align: center; }
    .page-title { font-size: 18px; font-weight: 800; color: #fde047; }

    .scrollable-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    .dark-input { width: 100%; background: #162032; border: 1.5px solid #eab308; color: #ffffff; padding: 10px 14px; border-radius: 10px; font-size: 13px; outline: none; margin-bottom: 12px; }

    .btn-pro-call { width: 100%; background: linear-gradient(135deg, #ca8a04 0%, #eab308 100%); color: #0f172a; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 800; text-align: center; cursor: pointer; }

    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #1e293b; padding: 6px 16px 12px 16px; display: flex; justify-content: space-around; z-index: 30; }
    .nav-btn { border: none; background: transparent; color: #64748b; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-decoration: none; }
    .nav-btn.active { color: #fde047; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sticky-header">
      <div class="page-title">👤 നിങ്ങളുടെ വിവരങ്ങൾ ചേർക്കുക</div>
    </div>

    <div class="scrollable-body">
      <div style="background: #1e293b; padding: 16px; border-radius: 16px; border: 1px solid #334155;">
        <form onsubmit="saveUserProfile(event)">
          <label style="font-size: 11px; color: #cbd5e1; font-weight: 700;">പേര്</label>
          <input type="text" id="uName" placeholder="നിങ്ങളുടെ പേര് നൽകുക" required class="dark-input">
          
          <label style="font-size: 11px; color: #cbd5e1; font-weight: 700;">ഫോൺ നമ്പർ</label>
          <input type="tel" id="uPhone" placeholder="ഫോൺ നമ്പർ നൽകുക" required class="dark-input">
          
          <label style="font-size: 11px; color: #cbd5e1; font-weight: 700;">വിലാസം / പ്രദേശം</label>
          <textarea id="uAddress" placeholder="വീട്ടുപേര് / പ്രദേശം" rows="3" required class="dark-input"></textarea>
          
          <button type="submit" class="btn-pro-call">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
        </form>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-btn"><span style="font-size: 16px;">🏪</span><span>ഡയറക്ടറി</span></a>
      <a href="profile.html" class="nav-btn active"><span style="font-size: 16px;">👤</span><span>എന്റെ വിവരങ്ങൾ</span></a>
      <a href="admin.html" class="nav-btn"><span style="font-size: 16px;">⚙️</span><span>അഡ്മിൻ</span></a>
    </nav>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('kolayad_user')) || null;

    if(currentUser) {
      document.getElementById('uName').value = currentUser.name || '';
      document.getElementById('uPhone').value = currentUser.phone || '';
      document.getElementById('uAddress').value = currentUser.address || '';
    }

    async function saveUserProfile(e) {
      e.preventDefault();
      currentUser = { 
        name: document.getElementById('uName').value, 
        phone: document.getElementById('uPhone').value, 
        address: document.getElementById('uAddress').value 
      };
      localStorage.setItem('kolayad_user', JSON.stringify(currentUser));
      
      try {
        if (window.db) {
          await window.setDoc(window.doc(window.db, "users", currentUser.phone), currentUser);
        }
        alert("നിങ്ങളുടെ വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!");
        window.location.href = "index.html";
      } catch (err) {
        console.error(err);
        alert("സേവ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.");
      }
    }
  </script>
</body>
</html>
