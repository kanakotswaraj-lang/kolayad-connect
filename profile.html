<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>എന്റെ വിവരങ്ങൾ - കോളയാട് കണക്ട്</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.serverTimestamp = serverTimestamp;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0f17; color: #f1f5f9; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .app-container {
      width: 100%; max-width: 480px; height: 100vh; background: #0f172a;
      border: 2px solid #eab308; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.25);
    }
    @media (min-width: 481px) { .app-container { border-radius: 28px; height: 95vh; margin-top: 2.5vh; } }
    .header-bar { padding: 16px; background: #0f172a; border-bottom: 1px solid #1e293b; text-align: center; }
    .header-title { font-size: 18px; font-weight: 800; color: #facc15; }
    .scrollable-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
    .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 16px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px; display: block; }
    .dark-input, select, textarea { 
      width: 100%; background: #162032; border: 1.5px solid #ca8a04; color: #ffffff; 
      padding: 10px 12px; border-radius: 10px; font-size: 12px; outline: none; 
    }
    .dark-input:focus, select:focus, textarea:focus { border-color: #fde047; }
    .btn-submit { 
      width: 100%; background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); 
      color: #0f172a; border: none; padding: 12px; border-radius: 12px; font-weight: 800; 
      font-size: 13px; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 14px rgba(234,179,8,0.3);
    }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #1e293b; padding: 6px 16px 12px 16px; display: flex; justify-content: space-around; z-index: 30; }
    .nav-btn { border: none; background: transparent; color: #64748b; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-decoration: none; }
    .nav-btn.active { color: #fde047; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-bar">
      <div class="header-title">👤 നിങ്ങളുടെ വിവരങ്ങൾ ചേർക്കുക</div>
    </div>

    <div class="scrollable-content">
      <div class="form-card">
        <form id="shopAddForm" onsubmit="saveShop(event)">
          
          <div class="form-group">
            <label>സ്ഥാപനം / സേവനത്തിന്റെ പേര് *</label>
            <input type="text" id="shopName" class="dark-input" placeholder="ഉദാ: രമേശൻ (ഇലക്ട്രീഷ്യൻ), ഗ്രീൻ മാൾ" required>
          </div>

          <div class="form-group">
            <label>കാറ്റഗറി (Category) *</label>
            <select id="shopCat" class="dark-input" required>
              <option value="">കാറ്റഗറി തിരഞ്ഞെടുക്കുക</option>
              <option value="worker">തൊഴിലാളികൾ</option>
              <option value="catering">കാറ്ററിംഗ്</option>
              <option value="supermarket">സൂപ്പർമാർക്കറ്റ്</option>
              <option value="hotel">ഹോട്ടൽ</option>
              <option value="bakery">ബേക്കറി</option>
              <option value="textiles">ടെക്സ്റ്റൈൽസ്</option>
              <option value="tailor">തയ്യൽക്കട</option>
              <option value="mobile">മൊബൈൽ ഷോപ്പ്</option>
              <option value="fish">മത്സ്യ മാർക്കറ്റ്</option>
              <option value="meat">ഇറച്ചിക്കടകൾ</option>
              <option value="watch">വാച്ച് റിപ്പയർ</option>
              <option value="lottery">ലോട്ടറി സ്റ്റാൾ</option>
              <option value="csc">സിഎസ്സി സെന്റർ</option>
              <option value="mill">ധാന്യപ്പൊടി മില്ല്</option>
              <option value="workshop">വർക്ക്‌ഷോപ്പ്</option>
              <option value="ayurveda">ആയുർവേദ ഷോപ്പ്</option>
              <option value="stationery">സ്റ്റേഷനറി കട</option>
              <option value="fruits">ഫ്രൂട്ട്സ് കട</option>
              <option value="auto">ഓട്ടോ / ടാക്സി</option>
              <option value="emergency">പ്രധാന നമ്പറുകൾ</option>
            </select>
          </div>

          <div class="form-group">
            <label>സ്ഥലം / വിലാസം *</label>
            <input type="text" id="shopLoc" class="dark-input" placeholder="ഉദാ: കോളയാട് / കവല ജംഗ്ഷൻ" required>
          </div>

          <div class="form-group">
            <label>ഫോൺ നമ്പർ *</label>
            <input type="tel" id="shopPhone" class="dark-input" placeholder="10 അക്ക ഫോൺ നമ്പർ" pattern="[0-9]{10}" required>
          </div>

          <!-- ഗൂഗിൾ മാപ്പ് ലിങ്ക് നൽകാനുള്ള പുതിയ ഫീൽഡ് -->
          <div class="form-group">
            <label>ഗൂഗിൾ മാപ്പ് ലൊക്കേഷൻ ലിങ്ക് (Google Maps Link)</label>
            <input type="url" id="shopMapLink" class="dark-input" placeholder="https://maps.app.goo.gl/...">
          </div>

          <div class="form-group">
            <label>വിവരങ്ങൾ / ചെയ്യുന്ന പണികൾ *</label>
            <textarea id="shopDesc" class="dark-input" rows="3" placeholder="ചെയ്യുന്ന സേവനങ്ങളുടെ വിവരങ്ങൾ ടൈപ്പ് ചെയ്യുക..." required></textarea>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
        </form>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-btn"><span style="font-size: 16px;">🏪</span><span>ഡയറക്ടറി</span></a>
      <a href="profile.html" class="nav-btn active"><span style="font-size: 16px;">👤</span><span>എന്റെ വിവരങ്ങൾ</span></a>
      <a href="admin.html" class="nav-btn"><span style="font-size: 16px;">⚙️</span><span>അഡ്മിൻ</span></a>
    </nav>
  </div>

  <script>
    async function saveShop(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = "സേവ് ചെയ്യുന്നു...";
      btn.disabled = true;

      const name = document.getElementById('shopName').value;
      const catSelect = document.getElementById('shopCat');
      const cat = catSelect.value;
      const catLabel = catSelect.options[catSelect.selectedIndex].text;
      const loc = document.getElementById('shopLoc').value;
      const phone = document.getElementById('shopPhone').value;
      const mapLink = document.getElementById('shopMapLink').value;
      const desc = document.getElementById('shopDesc').value;

      try {
        if (!window.db) {
          alert('ഡാറ്റാബേസ് കണക്ഷൻ വരുന്നുണ്ട്, ദയവായി 2 സെക്കൻഡ് കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.');
          btn.innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
          btn.disabled = false;
          return;
        }

        await window.addDoc(window.collection(window.db, "shops"), {
          name,
          cat,
          catLabel,
          loc,
          phone,
          mapLink: mapLink || "",
          desc,
          createdAt: window.serverTimestamp()
        });

        // യൂസറുടെ വിവരങ്ങൾ ലോക്കൽ സ്റ്റോറേജിൽ സേവ് വെക്കുന്നു
        localStorage.setItem('kolayad_user', JSON.stringify({ name, phone }));

        alert('നിങ്ങളുടെ വിവരങ്ങൾ വിജയകരമായി ചേർത്തു!');
        window.location.href = 'index.html';
      } catch (err) {
        console.error("Error adding document: ", err);
        alert('വിവരങ്ങൾ ചേർക്കുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
        btn.innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
