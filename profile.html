<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>പ്രൊഫൈൽ - കോളയാട് കണക്ട്</title>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --border-color: rgba(59, 130, 246, 0.4);
      --accent-gold: #facc15;
    }
    body {
      background-color: var(--bg-body);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .header {
      background: var(--bg-app);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      z-index: 10;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      margin-right: 10px;
    }
    .content-container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 100%);
    }
    .profile-card {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .profile-avatar {
      font-size: 60px;
      margin-bottom: 10px;
    }
    .profile-title {
      color: var(--accent-gold);
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 15px;
    }
    .info-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .info-label {
      color: #94a3b8;
      font-size: 12.5px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .info-value {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }
    .action-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    .action-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">← തിരികെ</a>
    <h2 style="margin: 0; font-size: 16px; color: #facc15;">👤 ഉപയോക്തൃ പ്രൊഫൈൽ</h2>
  </div>

  <div class="content-container">
    <div class="profile-card">
      <div class="profile-avatar">👨‍💻</div>
      <div class="profile-title">കോളയാട് കണക്ട് പ്രൊഫൈൽ</div>
      
      <div class="info-group">
        <div class="info-label">പേര് / യൂസർ ഐഡി</div>
        <div class="info-value" id="profileNameDisplay">കോളയാട് റെസിഡന്റ്</div>
      </div>

      <div class="info-group">
        <div class="info-label">സ്ഥലം</div>
        <div class="info-value">കോളയാട്, കണ്ണൂർ</div>
      </div>

      <div class="info-group">
        <div class="info-label">ആപ്പ് പതിപ്പ്</div>
        <div class="info-value">v1.0.0 (ഓഫ്‌ലൈൻ സപ്പോർട്ട്)</div>
      </div>

      <button class="action-btn" onclick="alert('പ്രൊഫൈൽ വിവരങ്ങൾ അപ്ഡേറ്റ് ചെയ്തു!')">വിവരങ്ങൾ മാറ്റുക ✏️</button>
    </div>
  </div>

</body>
</html>
