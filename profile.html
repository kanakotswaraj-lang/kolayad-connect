<!DOCTYPE html>
<html lang="ml">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc,
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getStorage, 
      ref, 
      uploadBytes, 
      getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.ref = ref;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    window.collection = collection;
    window.doc = doc;
    window.setDoc = setDoc;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif; }
    
    :root {
      --bg-body: #0b0f17;
      --bg-app: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #1e293b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .app-container {
      width: 100%; max-width: 480px; height: 100dvh; background: var(--bg-app);
      border: 2px solid #eab308; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.25);
    }

    @media (min-width: 481px) { .app-container { border-radius: 28px; height: 95vh; margin-top: 2.5vh; } }
    
    .header { padding: 16px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--bg-app); }
    .back-btn { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid #eab308; padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; text-decoration: none; }
    
    .scrollable-body { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; }
    .form-title { font-size: 16px; font-weight: 800; color: #fde047; margin-bottom: 14px; text-align: center; }
    
    .dark-input { 
      width: 100%; background: var(--bg-input); border: 2px solid #38bdf8; color: var(--text-main); 
      padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; outline: none; 
      margin-bottom: 12px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }
    .dark-input::placeholder { color: var(--text-sub); font-weight: normal; }
    
    label { font-size: 11px; color: var(--text-sub); font-weight: bold; display: block; margin-bottom: 4px; }
    
    .btn-submit { 
      width: 100%; background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #0f172a; 
      border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; 
      box-shadow: 0 4px 15px rgba(234,179,8,0.3); margin-top: 10px; 
    }

    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-app); border-top: 1px solid var(--border-color); padding: 6px 16px 12px 16px; display: flex; justify-content: space-around; z-index: 30; }
    .nav-btn { border: none; background: transparent; color: var(--text-sub); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-decoration: none; }
    .nav-btn.active { color: #fde047; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <a href="index.html" class="back-btn">⬅️ തിരികെ ഹോം പേജിലേക്ക്</a>
      <span style="font-size: 14px; font-weight: 800; color: #facc15;">കോളയാട് കണക്ട്</span>
    </div>

    <div class="scrollable-body">
      <div class="form-title">✨ നിങ്ങളുടെ സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ ചേർക്കുക</div>
      
      <form onsubmit="addNewShop(event)">
        <label>സ്ഥാപനത്തിന്റെ / സേവനത്തിന്റെ പേര് *</label>
        <input type="text" id="shopName" class="dark-input" placeholder="ഉദാ: രമേശൻ (ഇലക്ട്രീഷ്യൻ), ഗ്രീൻ മാൾ" required>

        <label>കാറ്റഗറി *</label>
        <select id="shopCat" class="dark-input" required>
          <option value="">കാറ്റഗറി തിരഞ്ഞെടുക്കുക</option>
          <option value="worker">തൊഴിലാളികൾ</option>
          <option value="catering">കാറ്ററിംഗ്</option>
          <option value="supermarket">സൂപ്പർമാർക്കറ്റ്</option>
          <option value="hotel">ഹോട്ടൽ</option>
          <option value="bakery">ബേക്കറി</option>
          <option value="textiles">ടെക്സ്റ്റൈൽസ്</option>
          <option value="tailor">തയ്യൽക്കട</option>
          <option value="mobile">മൊബൈൽ ഷോപ്പ്</option>
          <option value="fish">മത്സ്യ മാർക്കറ്റ്</option>
          <option value="meat">ഇറച്ചിക്കടകൾ</option>
          <option value="watch">വാച്ച് റിപ്പയർ</option>
          <option value="lottery">ലോട്ടറി സ്റ്റാൾ</option>
          <option value="csc">സിഎസ്സി സെന്റർ</option>
          <option value="mill">ധാന്യപ്പൊടി മില്ല്</option>
          <option value="workshop">വർക്ക്‌ഷോപ്പ്</option>
          <option value="ayurveda">ആയുർവേദ ഷോപ്പ്</option>
          <option value="stationery">സ്റ്റേഷനറി കട</option>
          <option value="fruits">ഫ്രൂട്ട്സ് കട</option>
          <option value="auto">ഓട്ടോ / ടാക്സി</option>
          <option value="emergency">പ്രധാന നമ്പറുകൾ</option>
          <option value="nursery">നഴ്സറി</option>
          <option value="society">സൊസൈറ്റി / സംഘങ്ങൾ</option>
        </select>

        <label>സ്ഥലം / വിലാസം *</label>
        <input type="text" id="shopLoc" class="dark-input" placeholder="ഉദാ: കോളയാട് / കവല ജംഗ്ഷൻ" required>

        <label>ഫോൺ നമ്പർ (10 അക്കം) *</label>
        <input type="tel" id="shopPhone" class="dark-input" placeholder="9876543210" pattern="[0-9]{10}" required>

        <label>ഗൂഗിൾ മാപ്പ് ലൊക്കേഷൻ ലിങ്ക് (ഓപ്ഷണൽ)</label>
        <input type="url" id="shopMap" class="dark-input" placeholder="https://maps.app.goo.gl/...">

        <label>വിവരങ്ങൾ / സേവനങ്ങൾ *</label>
        <textarea id="shopDesc" class="dark-input" rows="3" placeholder="ചെയ്യുന്ന സേവനങ്ങളെക്കുറിച്ചോ സാധനങ്ങളെക്കുറിച്ചോ എഴുതുക..." required></textarea>

        <label>സ്ഥാപനത്തിന്റെയോ സാധനങ്ങളുടെയോ ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
        <input type="file" id="shopImageFile" class="dark-input" accept="image/*" style="padding: 6px;">

        <button type="submit" class="btn-submit">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
      </form>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-btn"><span style="font-size: 16px;">🏪</span><span>ഡയറക്ടറി</span></a>
      <a href="profile.html" class="nav-btn active"><span style="font-size: 16px;">👤</span><span>എന്റെ വിവരങ്ങൾ</span></a>
      <a href="admin.html" class="nav-btn"><span style="font-size: 16px;">⚙️</span><span>അഡ്മിൻ</span></a>
    </nav>
  </div>

  <script>
    // ഫോട്ടോ പരമാവധി കംപ്രസ് ചെയ്ത് ഫയർബേസ് സ്റ്റോറേജിലേക്ക് അപ്‌ലോഡ് ചെയ്യുന്ന ഫങ്ഷൻ
    async function uploadCompressedImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 700; // ഫോട്ടോയുടെ പരമാവധി വീതി
            const scaleSize = MAX_WIDTH / img.width;
            
            if (scaleSize < 1) {
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
              try {
                const imageFileName = `shops/${Date.now()}_compressed.jpg`;
                const storageRef = window.ref(window.storage, imageFileName);
                
                const snapshot = await window.uploadBytes(storageRef, blob);
                const downloadURL = await window.getDownloadURL(snapshot.ref);
                
                resolve(downloadURL);
              } catch (error) {
                reject(error);
              }
            }, 'image/jpeg', 0.6); // 60% ക്വാളിറ്റി (സൈസ് തീരെ കുറവായിരിക്കും)
          };
        };
        reader.onerror = (error) => reject(error);
      });
    }

    async function addNewShop(e) {
      e.preventDefault();
      
      const name = document.getElementById('shopName').value;
      const catSelect = document.getElementById('shopCat');
      const cat = catSelect.value;
      const catLabel = catSelect.options[catSelect.selectedIndex].text;
      const loc = document.getElementById('shopLoc').value;
      const phone = document.getElementById('shopPhone').value;
      const mapLink = document.getElementById('shopMap').value;
      const desc = document.getElementById('shopDesc').value;
      const imageFile = document.getElementById('shopImageFile').files[0];

      try {
        let imageUrl = "";
        if (imageFile) {
          alert('ഫോട്ടോ കംപ്രസ് ചെയ്ത് അപ്‌ലോഡ് ചെയ്യുന്നു, ദയവായി കാത്തിരിക്കൂ...');
          imageUrl = await uploadCompressedImage(imageFile);
        }

        const shopId = 'shop_' + Date.now();
        await window.setDoc(window.doc(window.db, "shops", shopId), {
          name,
          cat,
          catLabel,
          loc,
          phone,
          mapLink,
          desc,
          imageUrl,
          createdAt: new Date().toISOString()
        });

        alert('നിങ്ങളുടെ സ്ഥാപനത്തിന്റെ വിവരങ്ങൾ വിജയകരമായി ചേർത്തിരിക്കുന്നു!');
        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        alert('വിവരങ്ങൾ സേവ് ചെയ്യുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
      }
    }
  </script>
</body>
