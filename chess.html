<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ചെസ്സ് അരീന - കോളയാട് കണക്ട്</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --bg-card: #131c3f;
      --border-color: rgba(59, 130, 246, 0.35);
      --accent-gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #172554 0%, #070b19 100%);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ഹെഡർ */
    .header {
      background: rgba(11, 17, 40, 0.96);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .header-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 900;
      color: var(--accent-gold);
      text-align: center;
      flex: 1;
    }

    /* പ്രധാന കണ്ടെയ്നർ */
    .chess-page-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 10px 10px 28px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* മോഡ് സ്വിച്ചർ & സ്റ്റാറ്റസ് */
    .mode-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      background: #131c3f;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .status-banner {
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(250, 204, 21, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      font-size: 14.5px;
      font-weight: 900;
      color: var(--accent-gold);
    }

    /* ബോർഡിന്റെ മുകളിലും താഴെയുമുള്ള വലിയ കരുക്കളുടെ ട്രേ */
    .captured-tray {
      width: 100%;
      min-height: 52px;
      background: linear-gradient(145deg, rgba(19, 28, 63, 0.95), rgba(15, 23, 42, 0.95));
      border: 2px solid rgba(250, 204, 21, 0.45);
      border-radius: 14px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .tray-label {
      font-size: 12px;
      font-weight: 800;
      color: #93c5fd;
      white-space: nowrap;
    }
    .captured-pieces-list {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 36px;
    }

    /* 3D രൂപത്തിലുള്ള വലിയ കരുക്കൾ (പുറത്തും ബോർഡിലും) */
    .piece-3d-outer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.25);
    }
    .piece-3d-white {
      color: #ffffff;
      text-shadow:
        0 2px 0 #94a3b8,
        0 5px 8px rgba(0, 0, 0, 0.85);
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.65));
    }
    .piece-3d-black {
      color: #0f172a;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55),
        0 4px 7px rgba(0, 0, 0, 0.8);
      filter: drop-shadow(0 2px 3px rgba(255, 255, 255, 0.22));
    }

    /* 3D സ്റ്റേജ് & വലിയ ബോർഡ് */
    .board-3d-perspective {
      perspective: 950px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2px 0;
    }
    .chess-board-3d {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      max-width: 416px;
      aspect-ratio: 1 / 1;
      background: #1e293b;
      padding: 6px;
      border-radius: 16px;
      border: 3px solid #facc15;
      transform: rotateX(8deg);
      transform-style: preserve-3d;
      box-shadow:
        0 10px 0 #78350f,
        0 20px 35px rgba(0, 0, 0, 0.8);
      user-select: none;
    }
    .sq {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .sq.light {
      background: linear-gradient(145deg, #64748b, #475569);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.22), inset 0 -2px 3px rgba(0, 0, 0, 0.35);
    }
    .sq.dark {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.1), inset 0 -2px 3px rgba(0, 0, 0, 0.55);
    }
    .sq.selected {
      background: linear-gradient(145deg, #f59e0b, #d97706) !important;
      box-shadow: inset 0 0 0 2.5px #ffffff, 0 0 12px rgba(250, 204, 21, 0.75);
    }
    .sq.last-move {
      box-shadow: inset 0 0 0 2px rgba(56, 189, 248, 0.7);
    }
    .sq.move-dot::after {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(250, 204, 21, 0.88);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
    }
    .sq.move-capture {
      box-shadow: inset 0 0 0 3px #ef4444;
      background: rgba(239, 68, 68, 0.25) !important;
    }
    .board-piece {
      font-size: clamp(29px, 8vw, 42px);
      line-height: 1;
      transform: translateZ(10px) translateY(-1px);
      pointer-events: none;
    }

    /* താഴത്തെ കൺട്രോൾ ബട്ടണുകൾ */
    .controls-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }
    .ctrl-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 11px;
      border: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-undo {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }
    .btn-reset {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="games.html" class="back-btn">← ഗെയിംസ്</a>
    <h1 class="header-title" id="pageTitle">♟️ 3D ചെസ്സ് അരീന</h1>
    <a href="chess-guide.html" class="back-btn" style="color:#facc15;border-color:#facc15;">പഠിക്കാം</a>
  </div>

  <div class="chess-page-wrap">
    <div class="mode-bar">
      <button type="button" class="mode-btn" id="mode2pBtn" onclick="switchMode('2p')">👥 2 പ്ലെയർ</button>
      <button type="button" class="mode-btn active" id="modeAiBtn" onclick="switchMode('ai')">🤖 കമ്പ്യൂട്ടർ (AI)</button>
    </div>

    <div class="status-banner" id="statusText">നിങ്ങളുടെ ടേൺ (White)</div>

    <!-- മുകൾ ഭാഗത്ത്: വെട്ടിയെടുത്ത കരുക്കൾ (Black Captured) -->
    <div class="captured-tray" id="topTray">
      <span class="tray-label" id="topTrayLabel">🤖 എതിരാളി വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="topCaptured"></div>
    </div>

    <!-- വലിയ 3D ചെസ്സ് ബോർഡ് -->
    <div class="board-3d-perspective">
      <div class="chess-board-3d" id="board"></div>
    </div>

    <!-- താഴെ ഭാഗത്ത്: വെട്ടിയെടുത്ത കരുക്കൾ (White Captured) -->
    <div class="captured-tray" id="bottomTray">
      <span class="tray-label" id="bottomTrayLabel" style="color:#38bdf8;">♔ നിങ്ങൾ വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="bottomCaptured"></div>
    </div>

    <div class="controls-row">
      <button type="button" class="ctrl-btn btn-undo" onclick="undoMove()">↩ നീക്കം മാറ്റുക</button>
      <button type="button" class="ctrl-btn btn-reset" onclick="resetGame()">🔄 പുതിയ കളി</button>
    </div>
  </div>

  <script>
    const pieceGlyphs = {
      p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
      P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
    };

    const squareNames = [
      'a8','b8','c8','d8','e8','f8','g8','h8',
      'a7','b7','c7','d7','e7','f7','g7','h7',
      'a6','b6','c6','d6','e6','f6','g6','h6',
      'a5','b5','c5','d5','e5','f5','g5','h5',
      'a4','b4','c4','d4','e4','f4','g4','h4',
      'a3','b3','c3','d3','e3','f3','g3','h3',
      'a2','b2','c2','d2','e2','f2','g2','h2',
      'a1','b1','c1','d1','e1','f1','g1','h1'
    ];

    let chess = new Chess();
    let mode = 'ai';
    let selectedSq = null;
    let lastMoveInfo = null;
    let whiteCaptured = []; // White വെട്ടിയെടുത്ത കറുത്ത കരുക്കൾ
    let blackCaptured = []; // Black വെട്ടിയെടുത്ത വെളുത്ത കരുക്കൾ
    let aiThinking = false;

    function detectInitialMode() {
      const params = new URLSearchParams(window.location.search);
      const m = params.get('mode');
      mode = (m === '2p') ? '2p' : 'ai';
      syncModeButtons();
    }

    function syncModeButtons() {
      document.getElementById('mode2pBtn').classList.toggle('active', mode === '2p');
      document.getElementById('modeAiBtn').classList.toggle('active', mode === 'ai');
      document.getElementById('pageTitle').innerText = mode === 'ai' ? '🔥 3D ചെസ്സ് Vs AI' : '♟️ 3D ചെസ്സ് (2P)';
      document.getElementById('topTrayLabel').innerText = mode === 'ai' ? '🤖 ബോട്ട് വെട്ടിയവ:' : '♚ കറുപ്പ് വെട്ടിയവ:';
      document.getElementById('bottomTrayLabel').innerText = mode === 'ai' ? '♔ നിങ്ങൾ വെട്ടിയവ:' : '♔ വെളുപ്പ് വെട്ടിയവ:';
    }

    function switchMode(newMode) {
      mode = newMode;
      syncModeButtons();
      resetGame();
    }

    function resetGame() {
      chess = new Chess();
      selectedSq = null;
      lastMoveInfo = null;
      whiteCaptured = [];
      blackCaptured = [];
      aiThinking = false;
      renderAll();
    }

    function renderCapturedTrays() {
      const topEl = document.getElementById('topCaptured');
      const bottomEl = document.getElementById('bottomCaptured');

      topEl.innerHTML = blackCaptured.length
        ? blackCaptured.map(t => `<span class="piece-3d-outer piece-3d-white">${pieceGlyphs[t.toUpperCase()]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;

      bottomEl.innerHTML = whiteCaptured.length
        ? whiteCaptured.map(t => `<span class="piece-3d-outer piece-3d-black">${pieceGlyphs[t]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      const grid = chess.board();
      const legalTargets = selectedSq
        ? chess.moves({ square: selectedSq, verbose: true }).map(m => m.to)
        : [];

      let html = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = squareNames[r * 8 + c];
          const isDark = (r + c) % 2 === 1;
          const piece = grid[r][c];
          const isSelected = selectedSq === sqName;
          const isLegal = legalTargets.includes(sqName);
          const isLast = lastMoveInfo && (lastMoveInfo.from === sqName || lastMoveInfo.to === sqName);

          let cls = `sq ${isDark ? 'dark' : 'light'}`;
          if (isSelected) cls += ' selected';
          if (isLast) cls += ' last-move';
          if (isLegal) cls += piece ? ' move-capture' : ' move-dot';

          let pieceHtml = '';
          if (piece) {
            const sym = piece.color === 'w' ? pieceGlyphs[piece.type.toUpperCase()] : pieceGlyphs[piece.type];
            const styleCls = piece.color === 'w' ? 'piece-3d-white' : 'piece-3d-black';
            pieceHtml = `<span class="board-piece ${styleCls}">${sym}</span>`;
          }

          html += `<div class="${cls}" onclick="onSquareClick('${sqName}')">${pieceHtml}</div>`;
        }
      }
      boardEl.innerHTML = html;
    }

    function updateStatus() {
      const statusEl = document.getElementById('statusText');
      if (aiThinking) {
        statusEl.innerText = '🤖 കമ്പ്യൂട്ടർ നീക്കം ആലോചിക്കുന്നു...';
        return;
      }
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w'
          ? (mode === 'ai' ? 'കമ്പ്യൂട്ടർ (Black)' : 'കറുപ്പ് (Black)')
          : (mode === 'ai' ? 'നിങ്ങൾ (White)' : 'വെളുപ്പ് (White)');
        statusEl.innerText = `🏆 ചെക്ക്മേറ്റ്! ${winner} വിജയിച്ചു!`;
        return;
      }
      if (chess.in_draw() || chess.in_stalemate() || chess.in_threefold_repetition()) {
        statusEl.innerText = '🤝 കളി സമനിലയിൽ (Draw)!';
        return;
      }

      let turnMsg = chess.turn() === 'w'
        ? (mode === 'ai' ? 'നിങ്ങളുടെ ടേൺ (White)' : 'വെളുപ്പ് (White) കളിക്കാരുടെ ടേൺ')
        : 'കറുപ്പ് (Black) കളിക്കാരുടെ ടേൺ';

      if (chess.in_check()) turnMsg += ' — ⚠️ ചെക്ക്!';
      statusEl.innerText = turnMsg;
    }

    function renderAll() {
      renderBoard();
      renderCapturedTrays();
      updateStatus();
    }

    function onSquareClick(sq) {
      if (aiThinking || chess.game_over()) return;
      if (mode === 'ai' && chess.turn() !== 'w') return;

      if (!selectedSq) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) {
          selectedSq = sq;
          renderBoard();
        }
        return;
      }

      if (selectedSq === sq) {
        selectedSq = null;
        renderBoard();
        return;
      }

      const move = chess.move({ from: selectedSq, to: sq, promotion: 'q' });
      selectedSq = null;

      if (!move) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) selectedSq = sq;
        renderBoard();
        return;
      }

      lastMoveInfo = { from: move.from, to: move.to };
      if (move.captured) {
        if (move.color === 'w') whiteCaptured.push(move.captured);
        else blackCaptured.push(move.captured);
      }

      renderAll();

      if (!chess.game_over() && mode === 'ai' && chess.turn() === 'b') {
        aiThinking = true;
        updateStatus();
        setTimeout(() => {
          const aiMove = pickBestAIMove();
          if (aiMove) {
            const exec = chess.move(aiMove);
            if (exec) {
              lastMoveInfo = { from: exec.from, to: exec.to };
              if (exec.captured) blackCaptured.push(exec.captured);
            }
          }
          aiThinking = false;
          renderAll();
        }, 260);
      }
    }

    function getPieceVal(type) {
      return type === 'p' ? 10 : type === 'n' ? 30 : type === 'b' ? 30 : type === 'r' ? 50 : type === 'q' ? 90 : 900;
    }

    function evaluateBoard() {
      const b = chess.board();
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (p) {
            const center = (r >= 2 && r <= 5 && c >= 2 && c <= 5) ? 2 : 0;
            score += p.color === 'b' ? (getPieceVal(p.type) + center) : -(getPieceVal(p.type) + center);
          }
        }
      }
      return score;
    }

    function minimax(depth, alpha, beta, isMax) {
      if (depth === 0 || chess.game_over()) return evaluateBoard();
      const moves = chess.moves({ verbose: true });
      if (isMax) {
        let best = -999999;
        for (const m of moves) {
          chess.move(m);
          best = Math.max(best, minimax(depth - 1, alpha, beta, false));
          chess.undo();
          alpha = Math.max(alpha, best);
          if (beta <= alpha) break;
        }
        return best;
      } else {
        let best = 999999;
        for (const m of moves) {
          chess.move(m);
          best = Math.min(best, minimax(depth - 1, alpha, beta, true));
          chess.undo();
          beta = Math.min(beta, best);
          if (beta <= alpha) break;
        }
        return best;
      }
    }

    function pickBestAIMove() {
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      let bestMove = moves[0];
      let bestVal = -999999;
      for (const m of moves) {
        chess.move(m);
        const val = minimax(2, -1000000, 1000000, false) + (Math.random() * 2);
        chess.undo();
        if (val > bestVal) {
          bestVal = val;
          bestMove = m;
        }
      }
      return bestMove;
    }

    function undoMove() {
      if (aiThinking) return;
      const steps = (mode === 'ai' && chess.turn() === 'w') ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const undone = chess.undo();
        if (!undone) break;
        if (undone.captured) {
          if (undone.color === 'w') whiteCaptured.pop();
          else blackCaptured.pop();
        }
      }
      selectedSq = null;
      lastMoveInfo = null;
      renderAll();
    }

    detectInitialMode();
    resetGame();
  </script>
</body>
</html>
