<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ചെസ്സ് അരീന - കോളയാട് കണക്ട്</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --bg-card: #131c3f;
      --border-color: rgba(59, 130, 246, 0.35);
      --accent-gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #172554 0%, #070b19 100%);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ഹെഡർ */
    .header {
      background: rgba(11, 17, 40, 0.96);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .header-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 900;
      color: var(--accent-gold);
      text-align: center;
      flex: 1;
    }

    /* പ്രധാന കണ്ടെയ്നർ */
    .chess-page-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 10px 10px 28px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* മോഡ് സ്വിച്ചർ */
    .mode-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      background: #131c3f;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* ലെവൽ ബാർ (ഇതിന്റെ അകത്തുതന്നെ അടുത്ത ലെവൽ) */
    .level-bar {
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .level-info {
      font-size: 13px;
      font-weight: 800;
      color: #e2e8f0;
    }
    .level-badge {
      color: #facc15;
      font-weight: 900;
    }
    .next-level-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 9px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35);
    }

    .status-banner {
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(250, 204, 21, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      font-size: 14.5px;
      font-weight: 900;
      color: var(--accent-gold);
      transition: all 0.2s ease;
    }
    .status-banner.in-check {
      background: rgba(127, 29, 29, 0.92);
      border-color: #ef4444;
      color: #fecaca;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
    }

    /* ബോർഡിന്റെ മുകളിലും താഴെയുമുള്ള വലിയ കരുക്കളുടെ ട്രേ */
    .captured-tray {
      width: 100%;
      min-height: 54px;
      background: linear-gradient(145deg, rgba(19, 28, 63, 0.96), rgba(15, 23, 42, 0.96));
      border: 2px solid rgba(250, 204, 21, 0.48);
      border-radius: 14px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .tray-label {
      font-size: 12px;
      font-weight: 800;
      color: #93c5fd;
      white-space: nowrap;
    }
    .captured-pieces-list {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 38px;
    }

    /* ഉയർന്ന ക്ലാരിറ്റിയുള്ള 3D കരുക്കൾ */
    .piece-3d-outer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.25);
    }
    .piece-3d-white {
      color: #ffffff;
      text-shadow:
        0 2px 0 #475569,
        0 5px 8px rgba(0, 0, 0, 0.9);
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.75)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.7));
    }
    .piece-3d-black {
      color: #090d16;
      text-shadow:
        0 0 2px #f8fafc,
        0 0 5px rgba(250, 204, 21, 0.75),
        0 3px 5px rgba(0, 0, 0, 0.95);
      filter:
        drop-shadow(0 0 1.5px #ffffff)
        drop-shadow(0 0 3.5px rgba(248, 250, 252, 0.85))
        drop-shadow(0 3px 4px rgba(0, 0, 0, 0.85));
    }

    /* 3D സ്റ്റേജ് & വലിയ ബോർഡ് */
    .board-3d-perspective {
      perspective: 950px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2px 0;
    }
    .chess-board-3d {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      max-width: 416px;
      aspect-ratio: 1 / 1;
      background: #1e293b;
      padding: 6px;
      border-radius: 16px;
      border: 3px solid #facc15;
      transform: rotateX(8deg);
      transform-style: preserve-3d;
      box-shadow:
        0 10px 0 #78350f,
        0 20px 35px rgba(0, 0, 0, 0.8);
      user-select: none;
    }
    .sq {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .sq.light {
      background: linear-gradient(145deg, #94a3b8, #64748b);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.32), inset 0 -2px 3px rgba(0, 0, 0, 0.35);
    }
    .sq.dark {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.14), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
    }
    .sq.selected {
      background: linear-gradient(145deg, #f59e0b, #d97706) !important;
      box-shadow: inset 0 0 0 2.5px #ffffff, 0 0 12px rgba(250, 204, 21, 0.8);
    }
    .sq.last-move {
      box-shadow: inset 0 0 0 2.5px rgba(56, 189, 248, 0.85);
    }
    /* ചെക്ക് കിട്ടുന്ന രാജാവിന്റെ കള്ളിയിൽ ചുവപ്പ് കളർ */
    .sq.king-in-check {
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%) !important;
      box-shadow: inset 0 0 0 3px #fecaca, 0 0 16px rgba(239, 68, 68, 0.95) !important;
    }
    .sq.move-dot::after {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(250, 204, 21, 0.92);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.75);
    }
    .sq.move-capture {
      box-shadow: inset 0 0 0 3px #ef4444;
      background: rgba(239, 68, 68, 0.28) !important;
    }
    .board-piece {
      font-size: clamp(29px, 8vw, 42px);
      line-height: 1;
      transform: translateZ(10px) translateY(-1px);
      pointer-events: none;
    }

    /* താഴത്തെ കൺട്രോൾ ബട്ടണുകൾ */
    .controls-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }
    .ctrl-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 11px;
      border: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-undo {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }
    .btn-reset {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }

    /* വിജയ / കളി അവസാനിക്കുന്ന മോഡൽ */
    .result-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .result-modal-backdrop.show {
      display: flex;
    }
    .result-modal-card {
      width: 100%;
      max-width: 350px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2.5px solid #facc15;
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
    }
    .result-trophy {
      font-size: 46px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .result-title {
      margin: 0 0 6px 0;
      font-size: 21px;
      font-weight: 900;
      color: #facc15;
    }
    .result-sub {
      margin: 0 0 18px 0;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="games.html" class="back-btn">← ഗെയിംസ്</a>
    <h1 class="header-title" id="pageTitle">♟️ 3D ചെസ്സ് അരീന</h1>
    <a href="chess-guide.html" class="back-btn" style="color:#facc15;border-color:#facc15;">പഠിക്കാം</a>
  </div>

  <div class="chess-page-wrap">
    <div class="mode-bar">
      <button type="button" class="mode-btn" id="mode2pBtn" onclick="switchMode('2p')">👥 2 പ്ലെയർ</button>
      <button type="button" class="mode-btn active" id="modeAiBtn" onclick="switchMode('ai')">🤖 കമ്പ്യൂട്ടർ (AI)</button>
    </div>

    <!-- ഇതിന്റെ അകത്തുതന്നെ അടുത്ത ലെവൽ -->
    <div class="level-bar" id="levelBar">
      <div class="level-info">
        ലെവൽ: <span class="level-badge" id="levelLabel">ലെവൽ 1 (ചലഞ്ച്)</span>
      </div>
      <button type="button" class="next-level-btn" id="nextLevelBtn" onclick="goNextLevel()">അടുത്ത ലെവൽ →</button>
    </div>

    <div class="status-banner" id="statusText">നിങ്ങളുടെ ടേൺ (White)</div>

    <!-- മുകൾ ഭാഗത്ത്: വെട്ടിയെടുത്ത കരുക്കൾ (Black Captured) -->
    <div class="captured-tray" id="topTray">
      <span class="tray-label" id="topTrayLabel">🤖 ബോട്ട് വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="topCaptured"></div>
    </div>

    <!-- വലിയ 3D ചെസ്സ് ബോർഡ് -->
    <div class="board-3d-perspective">
      <div class="chess-board-3d" id="board"></div>
    </div>

    <!-- താഴെ ഭാഗത്ത്: വെട്ടിയെടുത്ത കരുക്കൾ (White Captured) -->
    <div class="captured-tray" id="bottomTray">
      <span class="tray-label" id="bottomTrayLabel" style="color:#38bdf8;">♔ നിങ്ങൾ വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="bottomCaptured"></div>
    </div>

    <div class="controls-row">
      <button type="button" class="ctrl-btn btn-undo" onclick="undoMove()">↩ നീക്കം മാറ്റുക</button>
      <button type="button" class="ctrl-btn btn-reset" onclick="resetGame()">🔄 പുതിയ കളി</button>
    </div>
  </div>

  <!-- വിജയ / കളി അവസാനിക്കുന്ന മോഡൽ -->
  <div class="result-modal-backdrop" id="resultModal">
    <div class="result-modal-card">
      <div class="result-trophy" id="resultIcon">🏆</div>
      <h2 class="result-title" id="resultTitle">വിജയം!</h2>
      <p class="result-sub" id="resultSub">കളി പൂർത്തിയായിരിക്കുന്നു.</p>
      <div class="result-actions">
        <button type="button" class="ctrl-btn btn-reset" onclick="resetGame()">🔄 വീണ്ടും കളിക്കാം</button>
        <button type="button" class="ctrl-btn btn-undo" onclick="closeResultModal()">ബോർഡ് കാണാം</button>
      </div>
    </div>
  </div>

  <script>
    const pieceGlyphs = {
      p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
      P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
    };

    const squareNames = [
      'a8','b8','c8','d8','e8','f8','g8','h8',
      'a7','b7','c7','d7','e7','f7','g7','h7',
      'a6','b6','c6','d6','e6','f6','g6','h6',
      'a5','b5','c5','d5','e5','f5','g5','h5',
      'a4','b4','c4','d4','e4','f4','g4','h4',
      'a3','b3','c3','d3','e3','f3','g3','h3',
      'a2','b2','c2','d2','e2','f2','g2','h2',
      'a1','b1','c1','d1','e1','f1','g1','h1'
    ];

    const aiLevels = [
      { level: 1, name: 'ലെവൽ 1 (ചലഞ്ച്)', skill: 14, movetime: 900 },
      { level: 2, name: 'ലെവൽ 2 (അടുത്ത ലെവൽ)', skill: 17, movetime: 1200 },
      { level: 3, name: 'ലെവൽ 3 (മാസ്റ്റർ)', skill: 20, movetime: 1500 }
    ];

    let chess = new Chess();
    let mode = 'ai';
    let currentLevelIndex = 0;
    let selectedSq = null;
    let lastMoveInfo = null;
    let whiteCaptured = [];
    let blackCaptured = [];
    let aiThinking = false;
    let gameOverShown = false;

    // Stockfish Web Worker
    let engine = null;
    let engineReady = false;
    let pendingMoveResolver = null;

    function applyStockfishSkill() {
      if (engine && engineReady) {
        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        engine.postMessage('setoption name Skill Level value ' + cfg.skill);
        engine.postMessage('isready');
      }
    }

    function initStockfish() {
      try {
        const workerUrl = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';
        fetch(workerUrl)
          .then(res => {
            if (!res.ok) throw new Error('Stockfish fetch failed');
            return res.blob();
          })
          .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            engine = new Worker(blobUrl);
            engine.onmessage = function (e) {
              const line = typeof e.data === 'string' ? e.data : '';
              if (line === 'uciok') {
                applyStockfishSkill();
              } else if (line === 'readyok') {
                engineReady = true;
              } else if (line.startsWith('bestmove ')) {
                const parts = line.split(' ');
                const uci = parts[1];
                if (pendingMoveResolver) {
                  const resolve = pendingMoveResolver;
                  pendingMoveResolver = null;
                  resolve(uci);
                }
              }
            };
            engine.postMessage('uci');
          })
          .catch(() => {
            engineReady = false;
          });
      } catch (err) {
        engineReady = false;
      }
    }

    function queryStockfishBestMove(fen, movetimeMs) {
      return new Promise((resolve) => {
        if (!engine || !engineReady) {
          resolve(null);
          return;
        }
        pendingMoveResolver = (uci) => {
          if (!uci || uci === '(none)') return resolve(null);
          const from = uci.slice(0, 2);
          const to = uci.slice(2, 4);
          const promotion = uci.length > 4 ? uci[4] : 'q';
          const legal = chess.moves({ verbose: true });
          const matched = legal.find(m => m.from === from && m.to === to) || { from, to, promotion };
          resolve(matched);
        };
        engine.postMessage('stop');
        engine.postMessage('position fen ' + fen);
        engine.postMessage('go movetime ' + movetimeMs);
      });
    }

    function syncLevelUI() {
      const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
      const nextIndex = (currentLevelIndex + 1) % aiLevels.length;
      const nextCfg = aiLevels[nextIndex];
      document.getElementById('levelLabel').innerText = cfg.name;
      document.getElementById('nextLevelBtn').innerText = `അടുത്ത ലെവൽ (${nextCfg.level}) →`;
      document.getElementById('levelBar').style.display = (mode === 'ai') ? 'flex' : 'none';
      applyStockfishSkill();
    }

    function goNextLevel() {
      if (aiThinking) return;
      currentLevelIndex = (currentLevelIndex + 1) % aiLevels.length;
      syncLevelUI();
      resetGame();
    }

    function detectInitialMode() {
      const params = new URLSearchParams(window.location.search);
      const m = params.get('mode');
      mode = (m === '2p') ? '2p' : 'ai';
      syncModeButtons();
      syncLevelUI();
    }

    function syncModeButtons() {
      document.getElementById('mode2pBtn').classList.toggle('active', mode === '2p');
      document.getElementById('modeAiBtn').classList.toggle('active', mode === 'ai');
      document.getElementById('pageTitle').innerText = mode === 'ai' ? '🔥 3D ചെസ്സ് Vs AI' : '♟️ 3D ചെസ്സ് (2P)';
      document.getElementById('topTrayLabel').innerText = mode === 'ai' ? '🤖 ബോട്ട് വെട്ടിയവ:' : '♚ കറുപ്പ് വെട്ടിയവ:';
      document.getElementById('bottomTrayLabel').innerText = mode === 'ai' ? '♔ നിങ്ങൾ വെട്ടിയവ:' : '♔ വെളുപ്പ് വെട്ടിയവ:';
      document.getElementById('levelBar').style.display = (mode === 'ai') ? 'flex' : 'none';
    }

    function switchMode(newMode) {
      mode = newMode;
      syncModeButtons();
      resetGame();
    }

    function closeResultModal() {
      document.getElementById('resultModal').classList.remove('show');
    }

    function showResultModal(icon, title, sub) {
      document.getElementById('resultIcon').innerText = icon;
      document.getElementById('resultTitle').innerText = title;
      document.getElementById('resultSub').innerText = sub;
      document.getElementById('resultModal').classList.add('show');
    }

    function resetGame() {
      if (engine && engineReady) {
        engine.postMessage('stop');
        engine.postMessage('ucinewgame');
        applyStockfishSkill();
      }
      pendingMoveResolver = null;
      chess = new Chess();
      selectedSq = null;
      lastMoveInfo = null;
      whiteCaptured = [];
      blackCaptured = [];
      aiThinking = false;
      gameOverShown = false;
      closeResultModal();
      renderAll();
    }

    function renderCapturedTrays() {
      const topEl = document.getElementById('topCaptured');
      const bottomEl = document.getElementById('bottomCaptured');

      topEl.innerHTML = blackCaptured.length
        ? blackCaptured.map(t => `<span class="piece-3d-outer piece-3d-white">${pieceGlyphs[t.toUpperCase()]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;

      bottomEl.innerHTML = whiteCaptured.length
        ? whiteCaptured.map(t => `<span class="piece-3d-outer piece-3d-black">${pieceGlyphs[t]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;
    }

    function findKingSquare(color) {
      const grid = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = grid[r][c];
          if (p && p.color === color && p.type === 'k') {
            return squareNames[r * 8 + c];
          }
        }
      }
      return null;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      const grid = chess.board();
      const legalTargets = selectedSq
        ? chess.moves({ square: selectedSq, verbose: true }).map(m => m.to)
        : [];
      const checkedKingSq = chess.in_check() ? findKingSquare(chess.turn()) : null;

      let html = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = squareNames[r * 8 + c];
          const isDark = (r + c) % 2 === 1;
          const piece = grid[r][c];
          const isSelected = selectedSq === sqName;
          const isLegal = legalTargets.includes(sqName);
          const isLast = lastMoveInfo && (lastMoveInfo.from === sqName || lastMoveInfo.to === sqName);
          const isKingCheck = checkedKingSq === sqName;

          let cls = `sq ${isDark ? 'dark' : 'light'}`;
          if (isLast) cls += ' last-move';
          if (isSelected) cls += ' selected';
          if (isKingCheck) cls += ' king-in-check';
          if (isLegal) cls += piece ? ' move-capture' : ' move-dot';

          let pieceHtml = '';
          if (piece) {
            const sym = piece.color === 'w' ? pieceGlyphs[piece.type.toUpperCase()] : pieceGlyphs[piece.type];
            const styleCls = piece.color === 'w' ? 'piece-3d-white' : 'piece-3d-black';
            pieceHtml = `<span class="board-piece ${styleCls}">${sym}</span>`;
          }

          html += `<div class="${cls}" onclick="onSquareClick('${sqName}')">${pieceHtml}</div>`;
        }
      }
      boardEl.innerHTML = html;
    }

    function updateStatus() {
      const statusEl = document.getElementById('statusText');
      const isCheck = chess.in_check() && !chess.in_checkmate();
      statusEl.classList.toggle('in-check', isCheck);

      if (aiThinking) {
        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        statusEl.innerText = `🤖 കമ്പ്യൂട്ടർ (${cfg.name}) ആലോചിക്കുന്നു...`;
        return;
      }
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w'
          ? (mode === 'ai' ? 'കമ്പ്യൂട്ടർ (Black)' : 'കറുപ്പ് (Black)')
          : (mode === 'ai' ? 'നിങ്ങൾ (White)' : 'വെളുപ്പ് (White)');
        statusEl.innerText = `🏆 ചെക്ക്മേറ്റ്! ${winner} വിജയിച്ചു!`;
        if (!gameOverShown) {
          gameOverShown = true;
          const isHumanWin = (chess.turn() !== 'w');
          showResultModal(
            isHumanWin ? '🏆' : '🤖',
            `${winner} വിജയിച്ചു!`,
            'ചെക്ക്മേറ്റ് വഴി കളി അവസാനിച്ചിരിക്കുന്നു. പുതിയ കളി തുടങ്ങാം.'
          );
        }
        return;
      }
      if (chess.in_draw() || chess.in_stalemate() || chess.in_threefold_repetition()) {
        statusEl.innerText = '🤝 കളി സമനിലയിൽ (Draw)!';
        if (!gameOverShown) {
          gameOverShown = true;
          showResultModal('🤝', 'കളി സമനിലയിൽ!', 'നിയമപരമായ നീക്കങ്ങൾ ഇല്ലാത്തതിനാൽ കളി സമനിലയായി.');
        }
        return;
      }

      let turnMsg = chess.turn() === 'w'
        ? (mode === 'ai' ? 'നിങ്ങളുടെ ടേൺ (White)' : 'വെളുപ്പ് (White) കളിക്കാരുടെ ടേൺ')
        : 'കറുപ്പ് (Black) കളിക്കാരുടെ ടേൺ';

      if (chess.in_check()) {
        const whoChecked = chess.turn() === 'w' ? 'നിങ്ങളുടെ രാജാവിന്' : 'കറുത്ത രാജാവിന്';
        turnMsg += ` — 🔴 ചെക്ക്! (${whoChecked})`;
      }
      statusEl.innerText = turnMsg;
    }

    function renderAll() {
      renderBoard();
      renderCapturedTrays();
      updateStatus();
    }

    function fallbackBestMove() {
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      const val = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      let best = moves[0];
      let bestScore = -Infinity;
      for (const m of moves) {
        chess.move(m);
        let s = 0;
        if (chess.in_checkmate()) s = 100000;
        const b = chess.board();
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = b[r][c];
            if (p) s += p.color === 'b' ? (val[p.type] || 0) : -(val[p.type] || 0);
          }
        }
        chess.undo();
        if (s > bestScore) {
          bestScore = s;
          best = m;
        }
      }
      return best;
    }

    async function onSquareClick(sq) {
      if (aiThinking || chess.game_over()) return;
      if (mode === 'ai' && chess.turn() !== 'w') return;

      if (!selectedSq) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) {
          selectedSq = sq;
          renderBoard();
        }
        return;
      }

      if (selectedSq === sq) {
        selectedSq = null;
        renderBoard();
        return;
      }

      const move = chess.move({ from: selectedSq, to: sq, promotion: 'q' });
      selectedSq = null;

      if (!move) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) selectedSq = sq;
        renderBoard();
        return;
      }

      lastMoveInfo = { from: move.from, to: move.to };
      if (move.captured) {
        if (move.color === 'w') whiteCaptured.push(move.captured);
        else blackCaptured.push(move.captured);
      }

      renderAll();

      if (!chess.game_over() && mode === 'ai' && chess.turn() === 'b') {
        aiThinking = true;
        updateStatus();

        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        const currentFen = chess.fen();
        let chosen = await queryStockfishBestMove(currentFen, cfg.movetime);
        if (!chosen) {
          chosen = fallbackBestMove();
        }

        if (chosen && chess.turn() === 'b' && !chess.game_over()) {
          const exec = chess.move(chosen);
          if (exec) {
            lastMoveInfo = { from: exec.from, to: exec.to };
            if (exec.captured) blackCaptured.push(exec.captured);
          }
        }

        aiThinking = false;
        renderAll();
      }
    }

    function undoMove() {
      if (aiThinking) return;
      if (engine && engineReady) engine.postMessage('stop');
      pendingMoveResolver = null;
      gameOverShown = false;
      closeResultModal();
      const steps = (mode === 'ai' && chess.turn() === 'w') ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const undone = chess.undo();
        if (!undone) break;
        if (undone.captured) {
          if (undone.color === 'w') whiteCaptured.pop();
          else blackCaptured.pop();
        }
      }
      selectedSq = null;
      lastMoveInfo = null;
      renderAll();
    }

    detectInitialMode();
    initStockfish();
    resetGame();
  </script>
</body>
</html>
