<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ചെസ്സ് അരീന - കോളയാട് കണക്ട്</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root {
      --bg-body: #070b19;
      --bg-app: #0b1128;
      --bg-card: #131c3f;
      --border-color: rgba(59, 130, 246, 0.35);
      --accent-gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #172554 0%, #070b19 100%);
      color: #f8fafc;
      font-family: 'Noto Sans Malayalam', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ഹെഡർ */
    .header {
      background: rgba(11, 17, 40, 0.96);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 10px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .sound-btn {
      background: #1e293b;
      color: #4ade80;
      border: 1.5px solid #4ade80;
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .header-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      color: var(--accent-gold);
      text-align: center;
      flex: 1;
    }

    /* പ്രധാന കണ്ടെയ്നർ */
    .chess-page-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 10px 10px 28px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* മോഡ് സ്വിച്ചർ */
    .mode-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      background: #131c3f;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* ലെവൽ ബാർ */
    .level-bar {
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .level-info {
      font-size: 13px;
      font-weight: 800;
      color: #e2e8f0;
    }
    .level-badge {
      color: #facc15;
      font-weight: 900;
    }
    .next-level-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 9px;
      padding: 6px 11px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35);
    }

    .status-banner {
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid rgba(250, 204, 21, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      font-size: 14.5px;
      font-weight: 900;
      color: var(--accent-gold);
      transition: all 0.2s ease;
    }
    .status-banner.in-check {
      background: rgba(127, 29, 29, 0.92);
      border-color: #ef4444;
      color: #fecaca;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
    }

    /* ബോർഡിന്റെ മുകളിലും താഴെയുമുള്ള വലിയ കരുക്കളുടെ ട്രേ */
    .captured-tray {
      width: 100%;
      min-height: 54px;
      background: linear-gradient(145deg, rgba(19, 28, 63, 0.96), rgba(15, 23, 42, 0.96));
      border: 2px solid rgba(250, 204, 21, 0.48);
      border-radius: 14px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .tray-label {
      font-size: 12px;
      font-weight: 800;
      color: #93c5fd;
      white-space: nowrap;
    }
    .captured-pieces-list {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 38px;
    }

    /* ഉയർന്ന ക്ലാരിറ്റിയുള്ള 3D കരുക്കൾ */
    .piece-3d-outer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.25);
    }
    .piece-3d-white {
      color: #ffffff;
      text-shadow:
        0 2px 0 #334155,
        0 5px 8px rgba(0, 0, 0, 0.9);
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.75));
    }
    .piece-3d-black {
      color: #090d16;
      text-shadow:
        0 0 2px #f8fafc,
        0 0 5px rgba(250, 204, 21, 0.75),
        0 3px 5px rgba(0, 0, 0, 0.95);
      filter:
        drop-shadow(0 0 1.5px #ffffff)
        drop-shadow(0 0 3.5px rgba(248, 250, 252, 0.85))
        drop-shadow(0 3px 4px rgba(0, 0, 0, 0.85));
    }

    .piece-type-p.piece-3d-white {
      color: #e0f2fe;
      filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.85)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.8));
    }
    .piece-type-p.piece-3d-black {
      color: #070b14;
      filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.7)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.9));
    }
    .piece-type-b.piece-3d-white {
      color: #fef08a;
      filter: drop-shadow(0 0 3px rgba(250, 204, 21, 0.95)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.85));
    }
    .piece-type-b.piece-3d-black {
      color: #1e1b4b;
      filter: drop-shadow(0 0 2.5px #facc15) drop-shadow(0 0 4px rgba(251, 191, 36, 0.8)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.95));
    }

    /* 3D സ്റ്റേജ് & കളർഫുൾ വലിയ ബോർഡ് */
    .board-3d-perspective {
      perspective: 950px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 2px 0;
    }
    .chess-board-3d {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      max-width: 416px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #0f172a, #1e293b);
      padding: 6px;
      border-radius: 16px;
      border: 3px solid #facc15;
      transform: rotateX(8deg);
      transform-style: preserve-3d;
      box-shadow:
        0 10px 0 #92400e,
        0 20px 35px rgba(0, 0, 0, 0.82);
      user-select: none;
    }
    .sq {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .sq.light {
      background: linear-gradient(145deg, #fef9c3, #fde047);
      color: #0f172a;
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.65), inset 0 -2px 3px rgba(161, 98, 7, 0.35);
    }
    .sq.dark {
      background: linear-gradient(145deg, #0284c7, #1e3a8a);
      box-shadow: inset 0 2px 3px rgba(125, 211, 252, 0.35), inset 0 -2px 3px rgba(15, 23, 42, 0.65);
    }
    .sq.selected {
      background: linear-gradient(145deg, #22c55e, #15803d) !important;
      box-shadow: inset 0 0 0 2.5px #ffffff, 0 0 12px rgba(34, 197, 94, 0.85);
    }
    .sq.last-move {
      box-shadow: inset 0 0 0 2.5px rgba(249, 115, 22, 0.95);
    }
    .sq.king-in-check {
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%) !important;
      box-shadow: inset 0 0 0 3px #fecaca, 0 0 16px rgba(239, 68, 68, 0.95) !important;
    }
    .sq.move-dot::after {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.95);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.75);
    }
    .sq.move-capture {
      box-shadow: inset 0 0 0 3px #ef4444;
      background: rgba(239, 68, 68, 0.35) !important;
    }
    .board-piece {
      font-size: clamp(29px, 8vw, 42px);
      line-height: 1;
      transform: translateZ(10px) translateY(-1px);
      pointer-events: none;
    }

    .piece-tag {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      padding: 1px 3px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      pointer-events: none;
    }
    .piece-tag.bishop-tag {
      background: rgba(120, 53, 15, 0.88);
      color: #fde047;
    }

    /* താഴത്തെ കൺട്രോൾ ബട്ടണുകൾ */
    .controls-row {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }
    .ctrl-btn {
      flex: 1;
      padding: 10px 10px;
      border-radius: 11px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-undo {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }
    .btn-reset {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
    }
    .btn-wa {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #ffffff;
    }

    /* വിജയ / കളി അവസാനിക്കുന്ന മോഡൽ */
    .result-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .result-modal-backdrop.show {
      display: flex;
    }
    .result-modal-card {
      width: 100%;
      max-width: 350px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2.5px solid #facc15;
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85);
    }
    .result-trophy {
      font-size: 46px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .result-title {
      margin: 0 0 6px 0;
      font-size: 21px;
      font-weight: 900;
      color: #facc15;
    }
    .result-sub {
      margin: 0 0 18px 0;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">← ഹോം</a>
    <h1 class="header-title" id="pageTitle">♟️ 3D ചെസ്സ് അരീന</h1>
    <button type="button" id="soundToggleBtn" class="sound-btn" onclick="toggleSound()">🔊 ഓൺ</button>
  </div>

  <div class="chess-page-wrap">
    <div class="mode-bar">
      <button type="button" class="mode-btn" id="mode2pBtn" onclick="switchMode('2p')">👥 2 പ്ലെയർ</button>
      <button type="button" class="mode-btn active" id="modeAiBtn" onclick="switchMode('ai')">🤖 കമ്പ്യൂട്ടർ (AI)</button>
    </div>

    <div class="level-bar" id="levelBar">
      <div class="level-info">
        ലെവൽ: <span class="level-badge" id="levelLabel">ലെവൽ 1 (ചലഞ്ച്)</span>
      </div>
      <button type="button" class="next-level-btn" id="nextLevelBtn" onclick="goNextLevel()">അടുത്ത ലെവൽ →</button>
    </div>

    <div class="status-banner" id="statusText">⏳ AI എൻജിൻ തയ്യാറാകുന്നു...</div>

    <div class="captured-tray" id="topTray">
      <span class="tray-label" id="topTrayLabel">🤖 ബോട്ട് വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="topCaptured"></div>
    </div>

    <div class="board-3d-perspective">
      <div class="chess-board-3d" id="board"></div>
    </div>

    <div class="captured-tray" id="bottomTray">
      <span class="tray-label" id="bottomTrayLabel" style="color:#38bdf8;">♔ നിങ്ങൾ വെട്ടിയവ:</span>
      <div class="captured-pieces-list" id="bottomCaptured"></div>
    </div>

    <div class="controls-row">
      <button type="button" class="ctrl-btn btn-undo" onclick="undoMove()">↩ മാറ്റുക</button>
      <button type="button" class="ctrl-btn btn-reset" onclick="resetGame()">🔄 പുതിയത്</button>
      <a id="waInviteBtn" href="#" target="_blank" rel="noopener noreferrer" class="ctrl-btn btn-wa">💬 വാട്‌സാപ്പ്</a>
    </div>
  </div>

  <div class="result-modal-backdrop" id="resultModal">
    <div class="result-modal-card">
      <div class="result-trophy" id="resultIcon">🏆</div>
      <h2 class="result-title" id="resultTitle">വിജയം!</h2>
      <p class="result-sub" id="resultSub">കളി പൂർത്തിയായിരിക്കുന്നു.</p>
      <div class="result-actions">
        <button type="button" class="ctrl-btn btn-reset" onclick="resetGame()">🔄 വീണ്ടും കളിക്കാം</button>
        <button type="button" class="ctrl-btn btn-undo" onclick="closeResultModal()">ബോർഡ് കാണാം</button>
      </div>
    </div>
  </div>

  <script>
    // ഫോണിന്റെ ബാക്ക് ബട്ടൺ അമർത്തുമ്പോൾ കോളയാട് കണക്ട് index.html-ലേക്ക് പോകാൻ
    (function setupIndexBackNavigation() {
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ chessArena: true }, '', window.location.href);
          window.addEventListener('popstate', function () {
            window.location.replace('index.html');
          });
        }
      } catch (e) {}
    })();

    // വാട്‌സാപ്പ് ക്ഷണ സന്ദേശം
    (function setupWhatsAppInvite() {
      const shareUrl = window.location.href;
      const msg =
        `♟️ കോളയാട് കണക്ട് ചെസ്സ് ടീമിലേക്ക് സ്വാഗതം! ♟️\n\n` +
        `നമ്മുടെ നാട്ടിലെ ചെസ്സ് പ്രേമികൾക്കും തുടക്കക്കാർക്കും കുട്ടികൾക്കും ഒരുമിച്ച് കളിക്കാനും പഠിക്കാനും ഇതാ ഒരു കിടിലൻ ചെസ്സ് പേജ്!\n\n` +
        `✅ ഈസി, മീഡിയം, ഹാർഡ് എന്നിങ്ങനെ 3 ലെവലുകൾ\n` +
        `✅ മലയാളം കരുക്കളുടെ അടയാളങ്ങളും ലളിതമായ ടിപ്പുകളും\n` +
        `✅ ചെക്ക് മുന്നറിയിപ്പുകൾ, ശബ്ദങ്ങൾ, വ്യക്തമായ ബോർഡ്\n\n` +
        `ഇപ്പോൾ തന്നെ കളിച്ച് നോക്കൂ, നിങ്ങളുടെ സ്കോറും അനുഭവങ്ങളും നമ്മുടെ ടീമിൽ പങ്കുവെക്കൂ! 🏆\n\n` +
        `🔗 ഇവിടെ കളിക്കാം: ${shareUrl}`;
      const btn = document.getElementById('waInviteBtn');
      if (btn) {
        btn.href = `https://wa.me/?text=${encodeURIComponent(msg)}`;
      }
    })();

    // ശബ്ദ സംവിധാനം (Web Audio API)
    let soundEnabled = true;
    let audioCtx = null;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      } catch (e) {}
      return audioCtx;
    }

    function playTone(ctx, startOffset, duration, startFreq, endFreq, waveType, gainVal) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t0 = ctx.currentTime + startOffset;
      osc.type = waveType;
      osc.frequency.setValueAtTime(startFreq, t0);
      if (endFreq && endFreq !== startFreq) {
        osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
      }
      gain.gain.setValueAtTime(gainVal, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.01);
    }

    function playSound(kind) {
      if (!soundEnabled) return;
      try {
        const ctx = unlockAudio();
        if (!ctx) return;
        if (kind === 'capture') {
          playTone(ctx, 0.01, 0.16, 390, 120, 'triangle', 0.35);
        } else if (kind === 'check') {
          playTone(ctx, 0.01, 0.11, 587.33, 587.33, 'triangle', 0.35);
          playTone(ctx, 0.13, 0.16, 783.99, 783.99, 'triangle', 0.35);
        } else if (kind === 'win') {
          playTone(ctx, 0.01, 0.12, 523.25, 523.25, 'triangle', 0.35);
          playTone(ctx, 0.14, 0.12, 659.25, 659.25, 'triangle', 0.35);
          playTone(ctx, 0.27, 0.22, 783.99, 783.99, 'triangle', 0.38);
        } else {
          playTone(ctx, 0.01, 0.1, 320, 520, 'triangle', 0.32);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      if (btn) {
        btn.innerText = soundEnabled ? '🔊 ഓൺ' : '🔇 ഓഫ്';
        btn.style.color = soundEnabled ? '#4ade80' : '#f87171';
        btn.style.borderColor = soundEnabled ? '#4ade80' : '#f87171';
      }
      if (soundEnabled) {
        unlockAudio();
        playSound('move');
      }
    }

    const pieceGlyphs = {
      p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
      P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
    };

    const squareNames = [
      'a8','b8','c8','d8','e8','f8','g8','h8',
      'a7','b7','c7','d7','e7','f7','g7','h7',
      'a6','b6','c6','d6','e6','f6','g6','h6',
      'a5','b5','c5','d5','e5','f5','g5','h5',
      'a4','b4','c4','d4','e4','f4','g4','h4',
      'a3','b3','c3','d3','e3','f3','g3','h3',
      'a2','b2','c2','d2','e2','f2','g2','h2',
      'a1','b1','c1','d1','e1','f1','g1','h1'
    ];

    const aiLevels = [
      { level: 1, name: 'ലെവൽ 1 (ചലഞ്ച്)', skill: 14, movetime: 900, depth: 3 },
      { level: 2, name: 'ലെവൽ 2 (അടുത്ത ലെവൽ)', skill: 17, movetime: 1300, depth: 3 },
      { level: 3, name: 'ലെവൽ 3 (മാസ്റ്റർ)', skill: 20, movetime: 1700, depth: 4 }
    ];

    let chess = new Chess();
    let mode = 'ai';
    let currentLevelIndex = 0;
    let selectedSq = null;
    let lastMoveInfo = null;
    let whiteCaptured = [];
    let blackCaptured = [];
    let aiThinking = false;
    let gameOverShown = false;

    let engine = null;
    let engineReady = false;
    let engineLoading = true;
    let pendingMoveResolver = null;

    const stockfishSources = [
      'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js',
      'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
      'https://unpkg.com/stockfish.js@10.0.2/stockfish.js'
    ];

    function applyStockfishSkill() {
      if (engine) {
        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        engine.postMessage('setoption name Skill Level value ' + cfg.skill);
        engine.postMessage('isready');
      }
    }

    async function initStockfish() {
      engineLoading = true;
      updateStatus();

      for (const url of stockfishSources) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const scriptText = await res.text();
          if (!scriptText || scriptText.length < 1000) continue;

          const blob = new Blob([scriptText], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          const worker = new Worker(blobUrl);

          const ready = await new Promise((resolve) => {
            const timeout = setTimeout(() => resolve(false), 6000);
            worker.onmessage = function (e) {
              const line = typeof e.data === 'string' ? e.data : '';
              if (line === 'uciok') {
                const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
                worker.postMessage('setoption name Skill Level value ' + cfg.skill);
                worker.postMessage('isready');
              } else if (line === 'readyok') {
                clearTimeout(timeout);
                resolve(true);
              } else if (line.startsWith('bestmove ')) {
                const uci = line.split(' ')[1];
                if (pendingMoveResolver) {
                  const fn = pendingMoveResolver;
                  pendingMoveResolver = null;
                  fn(uci);
                }
              }
            };
            worker.onerror = () => {
              clearTimeout(timeout);
              resolve(false);
            };
            worker.postMessage('uci');
          });

          if (ready) {
            engine = worker;
            engineReady = true;
            engineLoading = false;
            updateStatus();
            return;
          } else {
            worker.terminate();
          }
        } catch (err) {}
      }

      engineReady = false;
      engineLoading = false;
      updateStatus();
    }

    function queryStockfishBestMove(fen, movetimeMs) {
      return new Promise((resolve) => {
        if (!engine || !engineReady) {
          resolve(null);
          return;
        }
        const safetyTimer = setTimeout(() => {
          pendingMoveResolver = null;
          resolve(null);
        }, movetimeMs + 3500);

        pendingMoveResolver = (uci) => {
          clearTimeout(safetyTimer);
          if (!uci || uci === '(none)') return resolve(null);
          const from = uci.slice(0, 2);
          const to = uci.slice(2, 4);
          const promotion = uci.length > 4 ? uci[4] : 'q';
          const legal = chess.moves({ verbose: true });
          const matched = legal.find(m => m.from === from && m.to === to) || { from, to, promotion };
          resolve(matched);
        };
        engine.postMessage('stop');
        engine.postMessage('position fen ' + fen);
        engine.postMessage('go movetime ' + movetimeMs);
      });
    }

    const pstPawn = [
       0,  0,  0,  0,  0,  0,  0,  0,
      50, 50, 50, 50, 50, 50, 50, 50,
      10, 10, 20, 30, 30, 20, 10, 10,
       5,  5, 10, 25, 25, 10,  5,  5,
       0,  0,  0, 20, 20,  0,  0,  0,
       5, -5,-10,  0,  0,-10, -5,  5,
       5, 10, 10,-20,-20, 10, 10,  5,
       0,  0,  0,  0,  0,  0,  0,  0
    ];
    const pstKnight = [
      -50,-40,-30,-30,-30,-30,-40,-50,
      -40,-20,  0,  0,  0,  0,-20,-40,
      -30,  0, 10, 15, 15, 10,  0,-30,
      -30,  5, 15, 20, 20, 15,  5,-30,
      -30,  0, 15, 20, 20, 15,  0,-30,
      -30,  5, 10, 15, 15, 10,  5,-30,
      -40,-20,  0,  5,  5,  0,-20,-40,
      -50,-40,-30,-30,-30,-30,-40,-50
    ];
    const pstBishop = [
      -20,-10,-10,-10,-10,-10,-10,-20,
      -10,  0,  0,  0,  0,  0,  0,-10,
      -10,  0,  5, 10, 10,  5,  0,-10,
      -10,  5,  5, 10, 10,  5,  5,-10,
      -10,  0, 10, 10, 10, 10,  0,-10,
      -10, 10, 10, 10, 10, 10, 10,-10,
      -10,  5,  0,  0,  0,  0,  5,-10,
      -20,-10,-10,-10,-10,-10,-10,-20
    ];
    const pstRook = [
       0,  0,  0,  0,  0,  0,  0,  0,
       5, 10, 10, 10, 10, 10, 10,  5,
      -5,  0,  0,  0,  0,  0,  0, -5,
      -5,  0,  0,  0,  0,  0,  0, -5,
      -5,  0,  0,  0,  0,  0,  0, -5,
      -5,  0,  0,  0,  0,  0,  0, -5,
      -5,  0,  0,  0,  0,  0,  0, -5,
       0,  0,  0,  5,  5,  0,  0,  0
    ];
    const pstQueen = [
      -20,-10,-10, -5, -5,-10,-10,-20,
      -10,  0,  0,  0,  0,  0,  0,-10,
      -10,  0,  5,  5,  5,  5,  0,-10,
       -5,  0,  5,  5,  5,  5,  0, -5,
        0,  0,  5,  5,  5,  5,  0, -5,
      -10,  5,  5,  5,  5,  5,  0,-10,
      -10,  0,  5,  0,  0,  0,  0,-10,
      -20,-10,-10, -5, -5,-10,-10,-20
    ];
    const pstKing = [
      -30,-40,-40,-50,-50,-40,-40,-30,
      -30,-40,-40,-50,-50,-40,-40,-30,
      -30,-40,-40,-50,-50,-40,-40,-30,
      -30,-40,-40,-50,-50,-40,-40,-30,
      -20,-30,-30,-40,-40,-30,-30,-20,
      -10,-20,-20,-20,-20,-20,-20,-10,
       20, 20,  0,  0,  0,  0, 20, 20,
       20, 30, 10,  0,  0, 10, 30, 20
    ];

    function evaluatePosition() {
      if (chess.in_checkmate()) {
        return chess.turn() === 'b' ? -99999 : 99999;
      }
      if (chess.in_draw() || chess.in_stalemate() || chess.in_threefold_repetition()) {
        return 0;
      }
      const weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      const tables = { p: pstPawn, n: pstKnight, b: pstBishop, r: pstRook, q: pstQueen, k: pstKing };
      const b = chess.board();
      let total = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = b[r][c];
          if (!piece) continue;
          const idx = piece.color === 'w' ? (r * 8 + c) : ((7 - r) * 8 + c);
          const score = (weights[piece.type] || 0) + (tables[piece.type] ? tables[piece.type][idx] : 0);
          total += piece.color === 'b' ? score : -score;
        }
      }
      return total;
    }

    function alphaBeta(depth, alpha, beta, isMax) {
      if (depth === 0 || chess.game_over()) {
        return evaluatePosition();
      }
      const moves = chess.moves({ verbose: true });
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));

      if (isMax) {
        let best = -Infinity;
        for (const m of moves) {
          chess.move(m);
          const val = alphaBeta(depth - 1, alpha, beta, false);
          chess.undo();
          if (val > best) best = val;
          if (best > alpha) alpha = best;
          if (beta <= alpha) break;
        }
        return best;
      } else {
        let best = Infinity;
        for (const m of moves) {
          chess.move(m);
          const val = alphaBeta(depth - 1, alpha, beta, true);
          chess.undo();
          if (val < best) best = val;
          if (best < beta) beta = best;
          if (beta <= alpha) break;
        }
        return best;
      }
    }

    function smartFallbackBestMove() {
      const moves = chess.moves({ verbose: true });
      if (!moves.length) return null;
      moves.sort(() => Math.random() - 0.5);
      moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));

      const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
      const depth = cfg.depth || 3;
      let bestMove = moves[0];
      let bestVal = -Infinity;

      for (const m of moves) {
        chess.move(m);
        const repPenalty = chess.in_threefold_repetition() ? -500 : 0;
        const val = alphaBeta(depth - 1, -Infinity, Infinity, false) + repPenalty;
        chess.undo();
        if (val > bestVal) {
          bestVal = val;
          bestMove = m;
        }
      }
      return bestMove;
    }

    function syncLevelUI() {
      const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
      const nextIndex = (currentLevelIndex + 1) % aiLevels.length;
      const nextCfg = aiLevels[nextIndex];
      document.getElementById('levelLabel').innerText = cfg.name;
      document.getElementById('nextLevelBtn').innerText = `അടുത്ത ലെവൽ (${nextCfg.level}) →`;
      document.getElementById('levelBar').style.display = (mode === 'ai') ? 'flex' : 'none';
      applyStockfishSkill();
    }

    function goNextLevel() {
      if (aiThinking) return;
      unlockAudio();
      currentLevelIndex = (currentLevelIndex + 1) % aiLevels.length;
      syncLevelUI();
      resetGame();
    }

    function detectInitialMode() {
      const params = new URLSearchParams(window.location.search);
      const m = params.get('mode');
      mode = (m === '2p') ? '2p' : 'ai';
      syncModeButtons();
      syncLevelUI();
    }

    function syncModeButtons() {
      document.getElementById('mode2pBtn').classList.toggle('active', mode === '2p');
      document.getElementById('modeAiBtn').classList.toggle('active', mode === 'ai');
      document.getElementById('pageTitle').innerText = mode === 'ai' ? '🔥 3D ചെസ്സ് Vs AI' : '♟️ 3D ചെസ്സ് (2P)';
      document.getElementById('topTrayLabel').innerText = mode === 'ai' ? '🤖 ബോട്ട് വെട്ടിയവ:' : '♚ കറുപ്പ് വെട്ടിയവ:';
      document.getElementById('bottomTrayLabel').innerText = mode === 'ai' ? '♔ നിങ്ങൾ വെട്ടിയവ:' : '♔ വെളുപ്പ് വെട്ടിയവ:';
      document.getElementById('levelBar').style.display = (mode === 'ai') ? 'flex' : 'none';
    }

    function switchMode(newMode) {
      unlockAudio();
      mode = newMode;
      syncModeButtons();
      resetGame();
    }

    function closeResultModal() {
      document.getElementById('resultModal').classList.remove('show');
    }

    function showResultModal(icon, title, sub) {
      document.getElementById('resultIcon').innerText = icon;
      document.getElementById('resultTitle').innerText = title;
      document.getElementById('resultSub').innerText = sub;
      document.getElementById('resultModal').classList.add('show');
    }

    function resetGame() {
      if (engine && engineReady) {
        engine.postMessage('stop');
        engine.postMessage('ucinewgame');
        applyStockfishSkill();
      }
      pendingMoveResolver = null;
      chess = new Chess();
      selectedSq = null;
      lastMoveInfo = null;
      whiteCaptured = [];
      blackCaptured = [];
      aiThinking = false;
      gameOverShown = false;
      closeResultModal();
      renderAll();
    }

    function renderCapturedTrays() {
      const topEl = document.getElementById('topCaptured');
      const bottomEl = document.getElementById('bottomCaptured');

      topEl.innerHTML = blackCaptured.length
        ? blackCaptured.map(t => `<span class="piece-3d-outer piece-3d-white piece-type-${t}">${pieceGlyphs[t.toUpperCase()]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;

      bottomEl.innerHTML = whiteCaptured.length
        ? whiteCaptured.map(t => `<span class="piece-3d-outer piece-3d-black piece-type-${t}">${pieceGlyphs[t]}</span>`).join('')
        : `<span style="font-size:12px;color:#64748b;">—</span>`;
    }

    function findKingSquare(color) {
      const grid = chess.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = grid[r][c];
          if (p && p.color === color && p.type === 'k') {
            return squareNames[r * 8 + c];
          }
        }
      }
      return null;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      const grid = chess.board();
      const legalTargets = selectedSq
        ? chess.moves({ square: selectedSq, verbose: true }).map(m => m.to)
        : [];
      const checkedKingSq = chess.in_check() ? findKingSquare(chess.turn()) : null;

      let html = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sqName = squareNames[r * 8 + c];
          const isDark = (r + c) % 2 === 1;
          const piece = grid[r][c];
          const isSelected = selectedSq === sqName;
          const isLegal = legalTargets.includes(sqName);
          const isLast = lastMoveInfo && (lastMoveInfo.from === sqName || lastMoveInfo.to === sqName);
          const isKingCheck = checkedKingSq === sqName;

          let cls = `sq ${isDark ? 'dark' : 'light'}`;
          if (isLast) cls += ' last-move';
          if (isSelected) cls += ' selected';
          if (isKingCheck) cls += ' king-in-check';
          if (isLegal) cls += piece ? ' move-capture' : ' move-dot';

          let pieceHtml = '';
          if (piece) {
            const sym = piece.color === 'w' ? pieceGlyphs[piece.type.toUpperCase()] : pieceGlyphs[piece.type];
            const colorCls = piece.color === 'w' ? 'piece-3d-white' : 'piece-3d-black';
            const typeCls = `piece-type-${piece.type}`;
            let tagHtml = '';
            if (piece.type === 'p') {
              tagHtml = `<span class="piece-tag">ക</span>`;
            } else if (piece.type === 'b') {
              tagHtml = `<span class="piece-tag bishop-tag">ആ</span>`;
            }
            pieceHtml = `<span class="board-piece ${colorCls} ${typeCls}">${sym}</span>${tagHtml}`;
          }

          html += `<div class="${cls}" onclick="onSquareClick('${sqName}')">${pieceHtml}</div>`;
        }
      }
      boardEl.innerHTML = html;
    }

    function updateStatus() {
      const statusEl = document.getElementById('statusText');
      const isCheck = chess.in_check() && !chess.in_checkmate();
      statusEl.classList.toggle('in-check', isCheck);

      if (mode === 'ai' && engineLoading) {
        statusEl.innerText = '⏳ Stockfish AI എൻജിൻ തയ്യാറാകുന്നു...';
        return;
      }
      if (aiThinking) {
        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        statusEl.innerText = `🤖 കമ്പ്യൂട്ടർ (${cfg.name}) ആലോചിക്കുന്നു...`;
        return;
      }
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w'
          ? (mode === 'ai' ? 'കമ്പ്യൂട്ടർ (Black)' : 'കറുപ്പ് (Black)')
          : (mode === 'ai' ? 'നിങ്ങൾ (White)' : 'വെളുപ്പ് (White)');
        statusEl.innerText = `🏆 ചെക്ക്മേറ്റ്! ${winner} വിജയിച്ചു!`;
        if (!gameOverShown) {
          gameOverShown = true;
          const isHumanWin = (chess.turn() !== 'w');
          playSound(isHumanWin ? 'win' : 'check');
          showResultModal(
            isHumanWin ? '🏆' : '🤖',
            `${winner} വിജയിച്ചു!`,
            'ചെക്ക്മേറ്റ് വഴി കളി അവസാനിച്ചിരിക്കുന്നു. പുതിയ കളി തുടങ്ങാം.'
          );
        }
        return;
      }
      if (chess.in_draw() || chess.in_stalemate() || chess.in_threefold_repetition()) {
        statusEl.innerText = '🤝 കളി സമനിലയിൽ (Draw)!';
        if (!gameOverShown) {
          gameOverShown = true;
          showResultModal('🤝', 'കളി സമനിലയിൽ!', 'നിയമപരമായ നീക്കങ്ങൾ ഇല്ലാത്തതിനാൽ കളി സമനിലയായി.');
        }
        return;
      }

      let turnMsg = chess.turn() === 'w'
        ? (mode === 'ai' ? 'നിങ്ങളുടെ ടേൺ (White)' : 'വെളുപ്പ് (White) കളിക്കാരുടെ ടേൺ')
        : 'കറുപ്പ് (Black) കളിക്കാരുടെ ടേൺ';

      if (chess.in_check()) {
        const whoChecked = chess.turn() === 'w' ? 'നിങ്ങളുടെ രാജാവിന്' : 'കറുത്ത രാജാവിന്';
        turnMsg += ` — 🔴 ചെക്ക്! (${whoChecked})`;
      }
      statusEl.innerText = turnMsg;
    }

    function renderAll() {
      renderBoard();
      renderCapturedTrays();
      updateStatus();
    }

    async function onSquareClick(sq) {
      unlockAudio();
      if (aiThinking || chess.game_over()) return;
      if (mode === 'ai' && (engineLoading || chess.turn() !== 'w')) return;

      if (!selectedSq) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) {
          selectedSq = sq;
          renderBoard();
        }
        return;
      }

      if (selectedSq === sq) {
        selectedSq = null;
        renderBoard();
        return;
      }

      const move = chess.move({ from: selectedSq, to: sq, promotion: 'q' });
      selectedSq = null;

      if (!move) {
        const piece = chess.get(sq);
        if (piece && piece.color === chess.turn()) selectedSq = sq;
        renderBoard();
        return;
      }

      lastMoveInfo = { from: move.from, to: move.to };
      if (move.captured) {
        if (move.color === 'w') whiteCaptured.push(move.captured);
        else blackCaptured.push(move.captured);
      }

      if (!chess.game_over()) {
        if (chess.in_check()) playSound('check');
        else if (move.captured) playSound('capture');
        else playSound('move');
      }

      renderAll();

      if (!chess.game_over() && mode === 'ai' && chess.turn() === 'b') {
        aiThinking = true;
        updateStatus();

        const cfg = aiLevels[currentLevelIndex] || aiLevels[0];
        const currentFen = chess.fen();
        let chosen = await queryStockfishBestMove(currentFen, cfg.movetime);
        if (!chosen) {
          await new Promise(r => setTimeout(r, 150));
          chosen = smartFallbackBestMove();
        }

        if (chosen && chess.turn() === 'b' && !chess.game_over()) {
          const exec = chess.move(chosen);
          if (exec) {
            lastMoveInfo = { from: exec.from, to: exec.to };
            if (exec.captured) blackCaptured.push(exec.captured);
            if (!chess.game_over()) {
              if (chess.in_check()) playSound('check');
              else if (exec.captured) playSound('capture');
              else playSound('move');
            }
          }
        }

        aiThinking = false;
        renderAll();
      }
    }

    function undoMove() {
      if (aiThinking) return;
      unlockAudio();
      if (engine && engineReady) engine.postMessage('stop');
      pendingMoveResolver = null;
      gameOverShown = false;
      closeResultModal();
      const steps = (mode === 'ai' && chess.turn() === 'w') ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        const undone = chess.undo();
        if (!undone) break;
        if (undone.captured) {
          if (undone.color === 'w') whiteCaptured.pop();
          else blackCaptured.pop();
        }
      }
      selectedSq = null;
      lastMoveInfo = null;
      renderAll();
    }

    detectInitialMode();
    resetGame();
    initStockfish();
  </script>
</body>
