<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>പ്രധാന അറിയിപ്പുകൾ - കോളയാട് കണക്ട്</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif; }
    
    :root {
      --bg-body: #f1f5f9;
      --bg-app: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
    }

    body.dark-mode {
      --bg-body: #050811;
      --bg-app: #091026;
      --bg-card: #0e1838;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --border-color: #1e294b;
    }

    body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    .app-container {
      width: 100%; max-width: 480px; height: 100dvh; background: var(--bg-app);
      border: 2px solid #1e3a8a; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 0 35px rgba(30, 58, 138, 0.15);
    }
    @media (min-width: 481px) { .app-container { border-radius: 28px; height: 95vh; margin-top: 2.5vh; } }

    .header-bar {
      padding: 12px 14px; 
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.95), rgba(15, 23, 42, 0.95)); 
      border-bottom: 2px solid #3b82f6;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      gap: 8px;
    }
    /* തലക്കെട്ടിന്റെ (Heading) അക്ഷരവലിപ്പം കൂട്ടിയിരിക്കുന്നു */
    .header-title {
      font-size: 15px; 
      font-weight: 800; 
      color: #ffffff;
      background: rgba(59, 130, 246, 0.25);
      padding: 7px 12px;
      border-radius: 12px;
      border: 1px solid rgba(59, 130, 246, 0.5);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    /* ഹോം ബട്ടണിന്റെ വലിപ്പവും കൂട്ടിയിരിക്കുന്നു */
    .back-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: 1.5px solid #93c5fd;
      padding: 7px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none;
      box-shadow: 0 2px 8px rgba(37,99,235,0.4);
      white-space: nowrap;
    }

    .scrollable-body { flex: 1; overflow-y: auto; padding: 16px 14px; background-color: var(--bg-body); }
    
    .notice-card {
      background: var(--bg-card); 
      border: 1.5px solid var(--border-color); 
      border-radius: 24px;
      padding: 18px; 
      margin-bottom: 16px; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    
    /* കാർഡിലെ തലക്കെട്ടിന്റെ വലിപ്പം കൂട്ടിയിരിക്കുന്നു */
    .notice-title { 
      font-size: 19px; 
      font-weight: 800; 
      color: var(--text-main); 
      margin: 8px 0 6px 0; 
    }
    /* വിവരണത്തിന്റെ അക്ഷരവലിപ്പവും കട്ടിയും കൂട്ടിയിരിക്കുന്നു */
    .notice-desc { 
      font-size: 15px; 
      color: var(--text-sub); 
      line-height: 1.6; 
      margin-bottom: 12px; 
      font-weight: 600;
    }
    .notice-img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 16px; cursor: zoom-in; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    #imageZoomModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
    #zoomedImage { width: 100%; max-height: 85vh; object-fit: contain; border-radius: 12px; }
  </style>
</head>
<body class="dark-mode">

  <div class="app-container">
    <div class="header-bar">
      <div class="header-title">📢 പ്രധാന അറിയിപ്പുകൾ</div>
      <a href="index.html" class="back-btn">🏠 ഹോമിലേക്ക്</a>
    </div>

    <div class="scrollable-body" id="announcementsList">
      <div style="text-align: center; color: var(--text-sub); padding: 30px;">അറിയിപ്പുകൾ ലോഡ് ചെയ്യുന്നു...</div>
    </div>
  </div>

  <!-- ഫോട്ടോ സൂം മോഡൽ -->
  <div id="imageZoomModal" onclick="closeZoomModal(event)">
    <div style="position:relative; width:100%; max-width:450px; text-align:center;">
      <img id="zoomedImage" src="" alt="Zoomed Image">
      <button onclick="closeZoomModalDirect()" style="margin-top:12px; background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer;">ക്ലോസ് ചെയ്യുക</button>
    </div>
  </div>

  <script>
    async function loadAllAnnouncements() {
      const container = document.getElementById('announcementsList');
      try {
        if (!window.db) {
          setTimeout(loadAllAnnouncements, 200);
          return;
        }

        const querySnapshot = await window.getDocs(window.collection(window.db, "notices"));
        let notices = [];
        if (!querySnapshot.empty) {
          notices = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } else {
          notices = JSON.parse(localStorage.getItem("appNotices")) || [];
        }

        if (notices.length === 0) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 30px;">അറിയിപ്പുകൾ ഒന്നും ലഭ്യമല്ല.</div>`;
          return;
        }

        container.innerHTML = notices.reverse().map(n => `
          <div class="notice-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <span style="background: #0284c7; color: white; padding: 4px 10px; border-radius: 10px; font-size: 11.5px; font-weight: bold;">പ്രധാന അറിയിപ്പ്</span>
              <span style="font-size: 12px; color: var(--text-sub); font-weight: 700;">📅 ${n.date || ''}</span>
            </div>
            <div class="notice-title">${n.title || ''}</div>
            <div class="notice-desc">${n.desc || ''}</div>
            ${n.imageUrl || n.image ? `<img src="${n.imageUrl || n.image}" class="notice-img" onclick="openZoomModal('${n.imageUrl || n.image}')">` : ''}
          </div>
        `).join('');

      } catch (err) {
        console.error("Error loading notices: ", err);
        container.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;">വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.</div>`;
      }
    }

    function openZoomModal(imgSrc) {
      document.getElementById('zoomedImage').src = imgSrc;
      document.getElementById('imageZoomModal').style.display = 'flex';
    }

    function closeZoomModal(event) {
      if (event.target.id === 'imageZoomModal') {
        document.getElementById('imageZoomModal').style.display = 'none';
      }
    }

    function closeZoomModalDirect() {
      document.getElementById('imageZoomModal').style.display = 'none';
    }

    window.onload = function() {
      loadAllAnnouncements();
    };
  </script>
</body>
</html>
