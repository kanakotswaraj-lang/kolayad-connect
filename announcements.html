<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>പ്രധാന അറിയിപ്പുകൾ</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      padding-bottom: 70px;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-back {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
    }
    .announcement-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .announcement-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- ഹെഡറും തിരികെ ബട്ടണും -->
    <div class="header-bar">
      <a href="index.html" class="btn-back">← തിരികെ</a>
      <span style="font-weight: bold; font-size: 15px; color: #f1f5f9;">📢 അറിയിപ്പുകളും ഓഫറുകളും</span>
    </div>

    <!-- അറിയിപ്പ് കാർഡ് ഉദാഹരണം -->
    <div class="announcement-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="announcement-badge">ഓഫർ</span>
        <span style="font-size: 12px; color: #94a3b8;">📅 05/11/2026</span>
      </div>
      <h3 style="margin: 0 0 8px 0; font-size: 16px; color: #ffffff;">ആയിരം രൂപയുടെ തുണിത്തരങ്ങൾ എടുക്കുമ്പോൾ 30% ഡിസ്കൗണ്ട്</h3>
      <p style="margin: 0; font-size: 13px; color: #cbd5e1; line-height: 1.5;">പ്രിയപ്പെട്ട നാട്ടുകാർക്കായി ഞങ്ങളുടെ സ്ഥാപനത്തിൽ പ്രത്യേക വിഷു/പെരുന്നാൾ ഓഫർ ലഭ്യമാണ്. എല്ലാവരുടെയും സഹകരണം പ്രതീക്ഷിക്കുന്നു.</p>
    </div>

    <!-- കൂടുതൽ അറിയിപ്പുകൾ ഇവിടെ ചേർക്കാം -->

  </div>

</body>
</html>
