<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>അഡ്മിൻ പാനൽ - കോളയാട് കണക്ട്</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc,
      setDoc,
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCedpjN9Urtc4V0bQhsnJof7hVPvEbHjbk",
      authDomain: "kolayad-connect.firebaseapp.com",
      projectId: "kolayad-connect",
      storageBucket: "kolayad-connect.firebasestorage.app",
      messagingSenderId: "400179608074",
      appId: "1:400179608074:web:b6f5c269d60662efcdfdf3",
      measurementId: "G-EYK4SLBXBB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.getDoc = getDoc;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Malayalam', sans-serif; }
    body { background-color: #0b0f17; color: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: #0f172a; border: 2px solid #eab308; border-radius: 20px; padding: 20px; box-shadow: 0 0 25px rgba(234,179,8,0.2); }
    h2 { color: #fde047; font-size: 20px; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; font-weight: bold; }
    .dark-input { width: 100%; background: #1e293b; border: 2px solid #38bdf8; color: #f1f5f9; padding: 10px; border-radius: 10px; font-size: 13px; outline: none; }
    .btn-save { width: 100%; background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #38bdf8; font-size: 12px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>⚙️ അഡ്മിൻ ക്രമീകരണങ്ങൾ</h2>

    <div class="form-group">
      <label>പ്രൊഫൈൽ ലോഗോ ഇമേജ് ലിങ്ക് (URL):</label>
      <input type="url" id="logoUrlInput" class="dark-input" placeholder="https://...">
      <button onclick="saveLogo()" class="btn-save" style="padding: 8px; font-size: 12px; margin-top: 6px;">ലോഗോ അപ്ഡേറ്റ് ചെയ്യുക</button>
    </div>

    <div class="form-group" style="margin-top: 20px;">
      <label>ഹെറോ ബാനർ ഇമേജ് ലിങ്ക് (URL):</label>
      <input type="url" id="bannerUrlInput" class="dark-input" placeholder="https://...">
      <button onclick="saveBanner()" class="btn-save" style="padding: 8px; font-size: 12px; margin-top: 6px;">ബാനർ അപ്ഡേറ്റ് ചെയ്യുക</button>
    </div>

    <a href="index.html" class="back-link">🏠 ഹോം പേജിലേക്ക് തിരിച്ചുപോവുക</a>
  </div>

  <script>
    async function loadCurrentSettings() {
      if (!window.db) {
        setTimeout(loadCurrentSettings, 500);
        return;
      }
      try {
        const logoDoc = await window.getDoc(window.doc(window.db, "settings", "app_logo"));
        if (logoDoc.exists()) {
          document.getElementById('logoUrlInput').value = logoDoc.data().url || '';
        }

        const bannerDoc = await window.getDoc(window.doc(window.db, "settings", "hero_banner"));
        if (bannerDoc.exists()) {
          document.getElementById('bannerUrlInput').value = bannerDoc.data().url || '';
        }
      } catch(e) {
        console.error(e);
      }
    }

    async function saveLogo() {
      const url = document.getElementById('logoUrlInput').value.trim();
      if(!url) { alert('ദയവായി ഒരു ലിങ്ക് നൽകുക!'); return; }
      try {
        await window.setDoc(window.doc(window.db, "settings", "app_logo"), { url });
        alert('പ്രൊഫൈൽ ലോഗോ വിജയകരമായി സേവ് ചെയ്തു!');
      } catch(e) {
        console.error(e);
        alert('സേവ് ചെയ്യുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
      }
    }

    async function saveBanner() {
      const url = document.getElementById('bannerUrlInput').value.trim();
      if(!url) { alert('ദയവായി ഒരു ലിങ്ക് നൽകുക!'); return; }
      try {
        await window.setDoc(window.doc(window.db, "settings", "hero_banner"), { url });
        alert('ഹെറോ ബാനർ വിജയകരമായി സേവ് ചെയ്തു!');
      } catch(e) {
        console.error(e);
        alert('സേവ് ചെയ്യുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
      }
    }

    setTimeout(loadCurrentSettings, 500);
  </script>
</body>
</html>
