          <option value="linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%)">💜 റോയൽ പർപ്പിൾ</option>

      <!-- സെക്ഷൻ 3: സ്ഥാപനങ്ങളുടെ ഫോട്ടോ മാറ്റാൻ -->

        <h3>✏️ സ്ഥാപനങ്ങളുടെ ഫോട്ടോ മാനേജ്മെന്റ്</h3>

          <label>രണ്ടാമത്തെ ഫോട്ടോ (Photo 2):</label>
          <input type="file" id="admPhoto2" accept="image/*" class="dark-input" style="padding: 6px; font-size: 11px;">
          <label class="checkbox-label"><input type="checkbox" id="removePhoto2"> ❌ രണ്ടാമത്തെ ഫോട്ടോ ഒഴിവാക്കുക</label>

          <label>മൂന്നാമത്തെ ഫോട്ടോ (Photo 3):</label>
          <input type="file" id="admPhoto3" accept="image/*" class="dark-input" style="padding: 6px; font-size: 11px;">
          <label class="checkbox-label"><input type="checkbox" id="removePhoto3"> ❌ മൂന്നാമത്തെ ഫോട്ടോ ഒഴിവാക്കുക</label>

          <label>നാലാമത്തെ ഫോട്ടോ (Photo 4):</label>
          <input type="file" id="admPhoto4" accept="image/*" class="dark-input" style="padding: 6px; font-size: 11px;">
          <label class="checkbox-label"><input type="checkbox" id="removePhoto4"> ❌ നാലാമത്തെ ഫോട്ടോ ഒഴിവാക്കുക</label>

          <button onclick="saveAdminPhotos()" class="btn-save" style="background: #38bdf8; color: #0f172a; margin-top: 6px;">മാറ്റങ്ങൾ സേവ് ചെയ്യുക</button>

      <!-- സെക്ഷൻ 4: രജിസ്റ്റർ ചെയ്ത സ്ഥാപനങ്ങൾ -->

        <h3>👥 രജിസ്റ്റർ ചെയ്ത സ്ഥാപനങ്ങൾ</h3>

      <button onclick="adminLogout()" style="background: #ef4444; color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 12px;">ലോഗ് ഔട്ട് ചെയ്യുക</button>
      <a href="index.html" class="back-link">🏠 ഹോം പേജിലേക്ക് തിരിച്ചുപോവുക</a>

  <script>
    let allShopsData = [];

    function checkAdminLogin() {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === "admin123") {
        localStorage.setItem('kolayad_admin', 'true');
        showPanel();
      } else {
        alert('പാസ്‌വേഡ് തെറ്റാണ്!');
      }
    }

    function adminLogout() {
      localStorage.removeItem('kolayad_admin');
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }

    function showPanel() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadMembers();
      loadAdminNotices();
      loadShopDropdown();
    }

    window.onload = function() {
      if (localStorage.getItem('kolayad_admin') === 'true') {
        showPanel();
      }
    };

    async function compressImageToString(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400;
            const scaleSize = MAX_WIDTH / img.width;
            
            if (scaleSize < 1) {
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.4));
          };
        };
        reader.onerror = (error) => reject(error);
      });
    }

    async function loadShopDropdown() {
      const select = document.getElementById('adminShopSelect');
      try {
        const snap = await window.getDocs(window.collection(window.db, "shops"));
        allShopsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        let html = '<option value="">സ്ഥാപനം തിരഞ്ഞെടുക്കുക</option>';
        allShopsData.forEach(s => {
          html += `<option value="${s.id}">${s.name} (${s.loc || ''})</option>`;
        });
        select.innerHTML = html;
      } catch(e) { console.error(e); }
    }

    function loadShopDetailsForEdit() {
      const id = document.getElementById('adminShopSelect').value;
      const formArea = document.getElementById('adminEditFormArea');
      if (!id) {
        formArea.style.display = 'none';
        return;
      }
      const shop = allShopsData.find(x => x.id === id);
      if (shop) {
        document.getElementById('editDocId').value = shop.id;
        document.getElementById('admEditName').value = shop.name || '';
        document.getElementById('admPhoto1').value = '';
        document.getElementById('admPhoto2').value = '';
        document.getElementById('admPhoto3').value = '';
        document.getElementById('admPhoto4').value = '';
        document.getElementById('removePhoto1').checked = false;
        document.getElementById('removePhoto2').checked = false;
        document.getElementById('removePhoto3').checked = false;
        document.getElementById('removePhoto4').checked = false;
        formArea.style.display = 'block';
      }
    }

    async function saveAdminPhotos() {
      const id = document.getElementById('editDocId').value;
      const name = document.getElementById('admEditName').value;
      
      const file1 = document.getElementById('admPhoto1').files[0];
      const file2 = document.getElementById('admPhoto2').files[0];
      const file3 = document.getElementById('admPhoto3').files[0];
      const file4 = document.getElementById('admPhoto4').files[0];

      const remove1 = document.getElementById('removePhoto1').checked;
      const remove2 = document.getElementById('removePhoto2').checked;
      const remove3 = document.getElementById('removePhoto3').checked;
      const remove4 = document.getElementById('removePhoto4').checked;

      try {
        alert('ഫോട്ടോകൾ പ്രോസസ്സ് ചെയ്ത് അപ്ഡേറ്റ് ചെയ്യുന്നു, ദയവായി കാത്തിരിക്കൂ...');
        const shop = allShopsData.find(x => x.id === id) || {};
        
        let updateData = { name };
        
        if (remove1) {
          updateData.imageUrl = "";
        } else if (file1) {
          updateData.imageUrl = await compressImageToString(file1);
        } else {
          updateData.imageUrl = shop.imageUrl || "";
        }

        if (remove2) {
          updateData.imageUrl2 = "";
        } else if (file2) {
          updateData.imageUrl2 = await compressImageToString(file2);
        } else {
          updateData.imageUrl2 = shop.imageUrl2 || "";
        }

        if (remove3) {
          updateData.imageUrl3 = "";
        } else if (file3) {
          updateData.imageUrl3 = await compressImageToString(file3);
        } else {
          updateData.imageUrl3 = shop.imageUrl3 || "";
        }

        if (remove4) {
          updateData.imageUrl4 = "";
        } else if (file4) {
          updateData.imageUrl4 = await compressImageToString(file4);
        } else {
          updateData.imageUrl4 = shop.imageUrl4 || "";
        }

        await window.updateDoc(window.doc(window.db, "shops", id), updateData);
        alert('സ്ഥാപനത്തിന്റെ വിവരങ്ങളും ഫോട്ടോകളും വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!');
        loadShopDropdown();
        document.getElementById('adminEditFormArea').style.display = 'none';
      } catch(e) {
        console.error(e);
        alert('അപ്ഡേറ്റ് ചെയ്യുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
      }
    }

    async function uploadAndSaveLogo() {
      const file = document.getElementById('logoFileInput').files[0];
      if (!file) { alert('ഫോട്ടോ തിരഞ്ഞെടുക്കുക!'); return; }
      try {
        const compressed = await compressImageToString(file);
        await window.setDoc(window.doc(window.db, "settings", "app_logo"), { url: compressed });
        alert('ലോഗോ അപ്ഡേറ്റ് ചെയ്തു!');
      } catch(e) { alert('പിഴവ് സംഭവിച്ചു.'); }
    }

    async function uploadAndSaveBanner() {
      const file = document.getElementById('bannerFileInput').files[0];
      if (!file) { alert('ഫോട്ടോ തിരഞ്ഞെടുക്കുക!'); return; }
      try {
        const compressed = await compressImageToString(file);
        await window.setDoc(window.doc(window.db, "settings", "hero_banner"), { url: compressed });
        alert('ബാനർ അപ്ഡേറ്റ് ചെയ്തു!');
      } catch(e) { alert('പിഴവ് സംഭവിച്ചു.'); }
    }

    async function postNotice() {
      const title = document.getElementById('noticeTitleInput').value.trim();
      const desc = document.getElementById('noticeDescInput').value.trim();
      const color = document.getElementById('noticeColorInput').value;
      const file = document.getElementById('noticeImageFile').files[0];

      if(!title || !desc) { alert('തലക്കെട്ടും വിശദാംശങ്ങളും നൽകുക!'); return; }

      try {
        alert('അറിയിപ്പ് പോസ്റ്റ് ചെയ്യുന്നു...');
        let imageUrl = "";
        if (file) imageUrl = await compressImageToString(file);

        await window.addDoc(window.collection(window.db, "notices"), { 
          title, desc, color, imageUrl, 
          date: new Date().toLocaleDateString('en-GB') 
        });

        alert('അറിയിപ്പ് വിജയകരമായി പോസ്റ്റ് ചെയ്തു!');
        document.getElementById('noticeTitleInput').value = '';
        document.getElementById('noticeDescInput').value = '';
        document.getElementById('noticeImageFile').value = '';
        loadAdminNotices();
      } catch(e) {
        console.error(e);
        alert('അറിയിപ്പ് പോസ്റ്റ് ചെയ്യുന്നതിൽ പിഴവ് സംഭവിച്ചു.');
      }
    }

    async function loadAdminNotices() {
      const container = document.getElementById('adminNoticesListContainer');
      try {
        const snap = await window.getDocs(window.collection(window.db, "notices"));
        if (snap.empty) { container.innerHTML = `<p style="font-size: 11px; color: #94a3b8;">അറിയിപ്പുകൾ ഒന്നുമില്ല.</p>`; return; }
        let html = '';
        snap.forEach(docSnap => {
          const data = docSnap.data();
          html += `
            <div class="member-card">
              <div><strong>${data.title || ''}</strong></div>
              <button onclick="deleteNotice('${docSnap.id}')" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;">നീക്കം ചെയ്യുക</button>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch(e) {}
    }

    async function deleteNotice(id) {
      if(confirm('ഈ അറിയിപ്പ് നീക്കം ചെയ്യണോ?')) {
        await window.deleteDoc(window.doc(window.db, "notices", id));
        loadAdminNotices();
      }
    }

    async function loadMembers() {
      const container = document.getElementById('membersListContainer');
      try {
        const snap = await window.getDocs(window.collection(window.db, "shops"));
        if (snap.empty) { container.innerHTML = `<p style="font-size: 11px; color: #94a3b8;">സ്ഥാപനങ്ങളൊന്നുമില്ല.</p>`; return; }
        let html = '';
        snap.forEach(docSnap => {
          const data = docSnap.data();
          html += `
            <div class="member-card">
              <div><strong>${data.name || ''}</strong><br><span style="color: #94a3b8;">📞 ${data.phone || ''}</span></div>
              <button onclick="deleteMember('${docSnap.id}')" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer;">നീക്കം ചെയ്യുക</button>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch(e) {}
    }

    async function deleteMember(id) {
      if(confirm('ഈ സ്ഥാപനം നീക്കം ചെയ്യണോ?')) {
        await window.deleteDoc(window.doc(window.db, "shops", id));
        loadMembers();
        loadShopDropdown();
      }
    }
  </script>
</body>
</html>
