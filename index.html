<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>കോളയാട് കണക്ട് - Kolayad Connect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      padding-bottom: 110px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #0f172a;
      border: 2px solid #10b981;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
      position: relative;
    }

    /* Cover & Hero Section (Mahestri Pro Style) */
    .hero-banner {
      position: relative;
      height: 180px;
      background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), #0f172a);
    }

    .top-action-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .admin-badge-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .profile-avatar-wrap {
      position: relative;
      margin-top: -55px;
      display: flex;
      justify-content: center;
      z-index: 5;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 26px;
      border: 4px solid #f59e0b;
      background: #1e293b url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=300&q=80') center/cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .app-title-box {
      text-align: center;
      padding: 12px 16px 6px 16px;
    }

    .main-app-name {
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    .date-pill {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Content Area */
    .content-padding {
      padding: 16px;
    }

    /* Search & Location Select */
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .dark-input, .dark-select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 13px;
      outline: none;
    }

    .dark-input:focus, .dark-select:focus {
      border-color: #38bdf8;
    }

    /* Horizontal Category Scroll Bar */
    .cat-scroll-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .cat-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: #34d399;
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    /* Card List Style (Mahestri Pro Border Cards) */
    .pro-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 5px solid #10b981;
      border-top: 1px solid #334155;
      border-right: 1px solid #334155;
      border-bottom: 1px solid #334155;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .pro-card.worker-card { border-left-color: #38bdf8; }
    .pro-card.hotel-card { border-left-color: #f59e0b; }
    .pro-card.medical-card { border-left-color: #ec4899; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: #38bdf8;
    }

    .item-name {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .item-loc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-desc {
      font-size: 12px;
      color: #cbd5e1;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      line-height: 1.4;
      border: 1px solid #1e293b;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-pro-call {
      flex: 1;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-pro-wa {
      width: 40px;
      height: 40px;
      background: #22c55e;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
    }

    /* Floating Add Action */
    .floating-bar {
      position: fixed;
      bottom: 75px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .btn-add-pro {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: 2px solid #34d399;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      cursor: pointer;
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 10px 16px 18px 16px;
      display: flex;
      justify-content: space-around;
      z-index: 30;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #10b981;
    }

    /* Modal Overlay */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      color: white;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HERO HEADER WITH COVER IMAGE -->
    <div class="hero-banner">
      <div class="hero-overlay"></div>
      <div class="top-action-bar">
        <div style="font-size: 12px; font-weight: 800; color: #f8fafc; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 12px;">🌴 കോളയാട്, കണ്ണൂർ</div>
        <button class="admin-badge-btn" onclick="toggleAdmin()" id="adminBtn">അഡ്മിൻ</button>
      </div>
    </div>

    <!-- CIRCULAR LOGO AVATAR -->
    <div class="profile-avatar-wrap">
      <div class="profile-avatar"></div>
    </div>

    <!-- TITLE & DATE -->
    <div class="app-title-box">
      <div class="main-app-name">കോളയാട് കണക്ട്</div>
      <div class="date-pill" id="liveDate">ഇന്ന്: ശനിയാഴ്ച, 24 ഒക്ടോബർ, 2026</div>
    </div>

    <div class="content-padding">

      <!-- SEARCH & LOCATION FILTER -->
      <div class="filter-group">
        <input type="text" id="searchInput" class="dark-input" onkeyup="render()" placeholder="🔍 സ്ഥാപനങ്ങൾ, തൊഴിലാളികൾ തിരയുക...">
        <select id="locationFilter" class="dark-select" onchange="render()">
          <option value="all">📍 എല്ലാ പ്രദേശങ്ങളും (All Locations)</option>
          <option value="കവല ജംഗ്ഷൻ">കവല ജംഗ്ഷൻ</option>
          <option value="വായനശാലപ്പടി">വായനശാലപ്പടി</option>
          <option value="മാർക്കറ്റ് റോഡ്">മാർക്കറ്റ് റോഡ്</option>
          <option value="ഈസ്റ്റ് ഗ്രാമം">ഈസ്റ്റ് ഗ്രാമം</option>
          <option value="ഹോസ്പിറ്റൽ ജംഗ്ഷൻ">ഹോസ്പിറ്റൽ ജംഗ്ഷൻ</option>
        </select>
      </div>

      <!-- HORIZONTAL CATEGORY SCROLL -->
      <div class="cat-scroll-container">
        <div class="cat-pill active" onclick="setCat('all', this)">📂 എല്ലാം</div>
        <div class="cat-pill" onclick="setCat('worker', this)">👷‍♂️ തൊഴിലാളികൾ</div>
        <div class="cat-pill" onclick="setCat('supermarket', this)">🛒 സൂപ്പർമാർക്കറ്റ്</div>
        <div class="cat-pill" onclick="setCat('hotel', this)">🍲 ഹോട്ടൽ</div>
        <div class="cat-pill" onclick="setCat('bakery', this)">🎂 ബേക്കറി</div>
        <div class="cat-pill" onclick="setCat('medical', this)">💊 മെഡിക്കൽ</div>
        <div class="cat-pill" onclick="setCat('hardware', this)">🔨 ഹാർഡ്‌വെയർ</div>
        <div class="cat-pill" onclick="setCat('rental', this)">🚜 വാടക ഉപകരണങ്ങൾ</div>
        <div class="cat-pill" onclick="setCat('events', this)">💡 ലൈറ്റ് & സൗണ്ട്</div>
      </div>

      <!-- LISTINGS AREA -->
      <div id="listings"></div>

    </div>

    <!-- FLOATING ADD BUTTON -->
    <div class="floating-bar">
      <button class="btn-add-pro" onclick="toggleModal('addModal')">+ പുതിയ വിവരങ്ങൾ ചേർക്കുക</button>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="render()">
        <span style="font-size: 18px;">🏪</span>
        <span>ഡയറക്ടറി</span>
      </button>
      <button class="nav-btn" onclick="showNotice()">
        <span style="font-size: 18px;">📢</span>
        <span>അറിയിപ്പുകൾ</span>
      </button>
      <button class="nav-btn" onclick="toggleAdmin()">
        <span style="font-size: 18px;">⚙️</span>
        <span>അഡ്മിൻ</span>
      </button>
    </nav>

  </div>

  <!-- ADMIN MODAL -->
  <div class="modal-bg" id="adminModal">
    <div class="modal-box" style="text-align: center;">
      <h3 style="margin-bottom: 10px;">അഡ്മിൻ ലോഗിൻ</h3>
      <input type="password" id="adminPass" placeholder="Passcode (1234)" class="dark-input" style="text-align: center; margin-bottom: 14px;">
      <div style="display: flex; gap: 10px;">
        <button onclick="toggleModal('adminModal')" class="dark-input" style="flex:1;">ക്യാൻസൽ</button>
        <button onclick="loginAdmin()" class="btn-pro-call" style="flex:1;">ലോഗിൻ</button>
      </div>
    </div>
  </div>

  <!-- ADD MODAL -->
  <div class="modal-bg" id="addModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px;">വിവരങ്ങൾ ചേർക്കുക</h3>
      <form onsubmit="saveShop(event)">
        <input type="text" id="sName" placeholder="പേര് / സ്ഥാപനം" required class="dark-input" style="margin-bottom: 10px;">
        <select id="sCat" class="dark-select" style="margin-bottom: 10px;">
          <option value="worker">തൊഴിലാളി / സേവനം</option>
          <option value="supermarket">സൂപ്പർമാർക്കറ്റ്</option>
          <option value="hotel">ഹോട്ടൽ</option>
          <option value="bakery">ബേക്കറി</option>
          <option value="medical">മെഡിക്കൽ ഷോപ്പ്</option>
          <option value="hardware">ഹാർഡ്‌വെയർ</option>
          <option value="rental">വാടക ഉപകരണങ്ങൾ</option>
          <option value="events">ലൈറ്റ് & സൗണ്ട്</option>
        </select>
        <input type="text" id="sLoc" placeholder="പ്രദേശം (ഉദാ: കവല ജംഗ്ഷൻ)" required class="dark-input" style="margin-bottom: 10px;">
        <textarea id="sDesc" placeholder="വിവരണം" rows="2" class="dark-input" style="margin-bottom: 10px; resize: none;"></textarea>
        <input type="tel" id="sPhone" placeholder="ഫോൺ നമ്പർ" required class="dark-input" style="margin-bottom: 14px;">
        <button type="submit" class="btn-pro-call" style="width: 100%; padding: 12px;">സമർപ്പിക്കുക</button>
      </form>
    </div>
  </div>

  <script>
    let isAdmin = false;
    let selectedCat = 'all';

    let shops = [
      { id: 1, name: "രമേശൻ (ഇലക്ട്രീഷ്യൻ & പ്ലംബർ)", cat: "worker", catLabel: "തൊഴിലാളി", loc: "കവല ജംഗ്ഷൻ", desc: "വീടുകളിലെ വയറിങ്, പ്ലംബിംഗ് പണികൾക്ക് വിളിക്കുക.", phone: "9876543210" },
      { id: 2, name: "ഹരിശ്രീ സൂപ്പർമാർക്കറ്റ്", cat: "supermarket", catLabel: "സൂപ്പർമാർക്കറ്റ്", loc: "കവല ജംഗ്ഷൻ", desc: "പച്ചക്കറികൾ, പലചരക്ക് സാധനങ്ങൾ ലഭ്യം.", phone: "9876543211" },
      { id: 3, name: "അൽ-മദീന ഹോട്ടൽ", cat: "hotel", catLabel: "ഹോട്ടൽ", loc: "മാർക്കറ്റ് റോഡ്", desc: "നാടൻ ഭക്ഷണങ്ങളും ബിരിയാണിയും ലഭ്യമാണ്.", phone: "9876543212" },
      { id: 4, name: "സിറ്റി മെഡിക്കൽസ്", cat: "medical", catLabel: "മെഡിക്കൽ", loc: "ഹോസ്പിറ്റൽ ജംഗ്ഷൻ", desc: "24 മണിക്കൂർ മരുന്നു സേവനം.", phone: "9876543213" }
    ];

    function render() {
      const list = document.getElementById('listings');
      const q = document.getElementById('searchInput').value.toLowerCase();
      const locFilter = document.getElementById('locationFilter').value;

      const filtered = shops.filter(s => {
        const matchCat = selectedCat === 'all' || s.cat === selectedCat;
        const matchLoc = locFilter === 'all' || s.loc.includes(locFilter);
        const matchQ = s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.loc.toLowerCase().includes(q);
        return matchCat && matchLoc && matchQ;
      });

      if(filtered.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:#64748b; padding:30px;">വിവരങ്ങൾ ഒന്നും ലഭ്യമല്ല!</div>`;
        return;
      }

      list.innerHTML = filtered.map(s => `
        <div class="pro-card ${s.cat}-card">
          <div class="card-top">
            <span class="badge-tag">${s.catLabel}</span>
            <span style="font-size:10px; color:#34d399; font-weight:800;">● ലഭ്യമാണ്</span>
          </div>
          <div class="item-name">${s.name}</div>
          <div class="item-loc">📍 ${s.loc}</div>
          <div class="item-desc">${s.desc}</div>
          <div class="card-actions">
            <a href="tel:${s.phone}" class="btn-pro-call">📞 കോൾ ചെയ്യുക ➡️</a>
            <a href="https://wa.me/91${s.phone}" target="_blank" class="btn-pro-wa">💬</a>
            ${isAdmin ? `<button onclick="delShop(${s.id})" style="background:#ef4444; color:white; border:none; padding:0 12px; border-radius:12px; font-weight:bold; cursor:pointer;">🗑️</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function setCat(cat, elem) {
      selectedCat = cat;
      document.querySelectorAll('.cat-pill').forEach(e => e.classList.remove('active'));
      elem.classList.add('active');
      render();
    }

    function showNotice() {
      document.getElementById('listings').innerHTML = `
        <div class="pro-card" style="border-left-color: #f59e0b;">
          <div class="badge-tag" style="color:#f59e0b;">അറിയിപ്പ്</div>
          <div class="item-name" style="margin-top:8px;">കോളയാട് കണക്ട് വാർത്തകൾ</div>
          <div class="item-desc">നിങ്ങളുടെ പ്രദേശത്തെ വാർത്തകളും അറിയിപ്പുകളും ഇവിടെ വരും!</div>
        </div>
      `;
    }

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleAdmin() {
      if(isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "അഡ്മിൻ";
        render();
      } else {
        toggleModal('adminModal');
      }
    }

    function loginAdmin() {
      if(document.getElementById('adminPass').value === '1234') {
        isAdmin = true;
        document.getElementById('adminBtn').innerText = "ലോഗ്ഔട്ട്";
        toggleModal('adminModal');
        document.getElementById('adminPass').value = '';
        render();
      } else {
        alert("തെറ്റായ പാസ്‌വേഡ്!");
      }
    }

    function saveShop(e) {
      e.preventDefault();
      const n = {
        id: Date.now(),
        name: document.getElementById('sName').value,
        cat: document.getElementById('sCat').value,
        catLabel: document.getElementById('sCat').options[document.getElementById('sCat').selectedIndex].text,
        loc: document.getElementById('sLoc').value,
        desc: document.getElementById('sDesc').value,
        phone: document.getElementById('sPhone').value
      };
      shops.unshift(n);
      toggleModal('addModal');
      render();
    }

    function delShop(id) {
      if(confirm("ഇത് ഒഴിവാക്കണോ?")) {
        shops = shops.filter(s => s.id !== id);
        render();
      }
    }

    render();
  </script>
</body>
</html>
